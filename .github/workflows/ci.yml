name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.14"}
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Ruff gate (curated select, no format)
        run: python -m pip install "ruff==0.16.7" && python -m ruff check harness_fleet/ tests/
      - name: Mypy baseline gate (no strict)
        run: python -m pip install "mypy==2.3.1" && python -m mypy harness_fleet/
      - name: Check shared route-policy and handoff contracts
        run: python scripts/check_harness_drift.py --self --handoff-contract tests/fixtures/handoff-contracts.json
      - name: Verify clean installed wheel
        run: python scripts/check_wheel.py --distribution harness-fleet
