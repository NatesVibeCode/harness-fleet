<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Studio</title>
<style>
  :root {
    color-scheme: light dark;
    --line: #8884;
    --accent: #2a7;
    --bad: #c33;
    --page: #14161a;
    --ink: #e8eaef;
    --raised: #ffffff0a;
  }
  @media (prefers-color-scheme: light) {
    :root { --page: #ffffff; --ink: #1b1d21; --raised: #00000006; --line: #0003; }
  }
  html { background: var(--page); }
  body { background: var(--page); color: var(--ink); font-family: system-ui, sans-serif;
    margin: 0 auto; max-width: 860px; padding: 22px 24px 64px; line-height: 1.5; }
  h1 { font-size: 1.4rem; margin: 0 0 0.15em; }
  .meta { font-size: 0.76rem; opacity: 0.6; margin: 0 0 1em; }
  .hint { font-size: 0.84rem; opacity: 0.78; margin: 0.4em 0; }
  .counts { font-size: 0.82rem; opacity: 0.75; }
  details { border-top: 1px solid var(--line); padding: 6px 0; }
  details > summary { cursor: pointer; font-size: 0.86rem; text-transform: uppercase;
    letter-spacing: 0.05em; opacity: 0.85; padding: 4px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 8px 0; }
  .row label { display: flex; flex-direction: column; font-size: 0.8rem; gap: 2px; }
  input[type=text], input[type=search], select { background: Field; color: FieldText;
    border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; font: inherit; }
  button { background: ButtonFace; color: ButtonText; border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.ghost { padding: 2px 8px; font-size: 0.76rem; opacity: 0.9; }

  #cards { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .card { border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer;
    min-width: 128px; background: var(--raised); }
  .card.off { opacity: 0.5; }
  .card.unavail { border-style: dashed; }
  .card:hover { border-color: var(--accent); }
  .hname { font-weight: 600; }
  .hbin, .hstatus, .hnote { font-size: 0.74rem; opacity: 0.72; }
  .hstatus.ok::before { content: "● "; color: var(--accent); }
  .hstatus.no::before { content: "○ "; }
  .hnote { font-family: ui-monospace, monospace; }
  .hnote.bad { color: var(--bad); opacity: 1; }

  .mgroup { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 8px 0;
    background: var(--raised); }
  .mgroup-head { display: flex; gap: 10px; align-items: baseline; }
  .mlist { columns: 2; font-size: 0.82rem; margin-top: 6px; }
  .mlist label { display: block; break-inside: avoid; padding: 2px 0; }
  .badge { font-size: 0.7rem; border: 1px solid var(--line); border-radius: 6px;
    padding: 0 5px; margin-left: 5px; opacity: 0.85; }
  .cmd { font-family: ui-monospace, monospace; font-size: 0.78rem; opacity: 0.85;
    background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 9px; white-space: pre-wrap; word-break: break-word; }
  .err { color: var(--bad); }
  @media (max-width: 640px) { .mlist { columns: 1; } }
</style>
</head>
<body>
<h1>Harness Studio</h1>
<p class="meta" id="metaLine"></p>

<details open>
  <summary>Harnesses</summary>
  <div id="cards"></div>
  <p class="hint">Off by default — click to include. Each CLI manages its own login; the hint under a card is that harness's own command.</p>
</details>

<details open>
  <summary>Models</summary>
  <div class="row">
    <label>Mode
      <select id="modeSel">
        <option value="free">Free models</option>
        <option value="specific">Specific models</option>
      </select>
    </label>
    <button id="refreshBtn" type="button">Refresh</button>
    <span id="refreshMsg" class="hint"></span>
  </div>
  <p class="hint" id="modelSummary"></p>
  <p class="cmd" id="cmdLine"></p>
  <div id="refreshBox"></div>
  <div id="models"></div>
</details>

<script>
const H = { harnesses: [], routes: [], meta: null, mode: "free",
  selected: new Set(), picked: new Set(), refresh: {} };

// Each CLI owns its own login command; we only surface it in words a
// non-technical user can act on.
const LOGIN_HINT = {
  opencode: "free models included — sign in: opencode auth login",
  claude: "sign in: claude auth",
  codex: "sign in: codex login",
  cursor: "sign in: cursor-agent login",
  grok: "sign in: grok login",
  muse: "sign in: muse login",
  antigravity: null,
};
// API providers are configured by environment, not by a login subcommand.
const PROVIDER_HINT = {
  openrouter: "needs a free key — get one at openrouter.ai/keys",
  openai_compatible: "needs a base URL and key",
  groq: "needs a GROQ_API_KEY",
  cerebras: "needs a CEREBRAS_API_KEY",
  ollama: "runs on your computer, no signup — ollama.com/download",
  lmstudio: "runs on your computer, no signup — lmstudio.ai",
  vllm: "local endpoint",
};

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  let j = {};
  try { j = await r.json(); } catch (e) { j = {}; }
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function stripAnsi(s) {
  return String(s ?? "").replace(/\u001b\[[0-9;]*m/g, "").replace(/[\u0000-\u0008\u000b-\u001f]/g, " ").trim();
}
function firstLine(s, limit) {
  const text = stripAnsi(s).split("\n")[0].trim();
  return text.length > limit ? text.slice(0, limit) + "…" : text;
}

function modelProviders() {
  return [...new Set(H.routes.map(r => r.provider))].filter(p => p !== "demo").sort();
}
function routesOf(provider) { return H.routes.filter(r => r.provider === provider); }
// Only routes the engine would actually admit. Disabled routes are stale seeds
// or unpriced models, so they are not choices.
function usableOf(provider) { return routesOf(provider).filter(r => r.enabled); }
function disabledCount(provider) { return routesOf(provider).length - usableOf(provider).length; }
function freeOf(provider) {
  return usableOf(provider).filter(r => r.price_state === "price_observed_zero");
}
// Everything selectable: the CLI harnesses, plus API providers that have models.
function targets() {
  const harnessNames = H.harnesses.map(h => h.name);
  const apiProviders = modelProviders().filter(p => !harnessNames.includes(p));
  return [...harnessNames, ...apiProviders];
}
function selectedRoutes() {
  const on = [...H.selected];
  if (H.mode === "free") {
    return H.routes.filter(r => on.includes(r.provider) && r.price_state === "price_observed_zero" && r.enabled);
  }
  return H.routes.filter(r => on.includes(r.provider) && H.picked.has(r.id));
}

function renderMeta() {
  const el = document.getElementById("metaLine");
  el.textContent = H.meta
    ? `${H.meta.studio} · ${H.meta.workspace} · schema ${H.meta.schema_version}`
    : "";
}
function renderCards() {
  const box = document.getElementById("cards"); box.innerHTML = "";
  targets().forEach(name => {
    const harness = H.harnesses.find(h => h.name === name);
    const on = H.selected.has(name);
    const card = document.createElement("div");
    card.className = "card" + (on ? "" : " off") + (harness && !harness.available ? " unavail" : "");
    if (harness) card.title = harness.detail;
    const status = H.refresh[name];
    const hint = LOGIN_HINT[name] || PROVIDER_HINT[name];
    const note = status
      ? `<div class="hnote bad" title="${esc(status)}">${esc(firstLine(status, 42))}</div>`
      : (hint ? `<div class="hnote">${esc(hint)}</div>` : "");
    const sub = harness
      ? `<div class="hbin">${esc(harness.binary)} · ${harness.available ? "installed" : "not found"}</div>`
      : `<div class="hbin">${freeOf(name).length} free / ${usableOf(name).length} available</div>`;
    card.innerHTML = `<div class="hname">${esc(name)}</div>${sub}${note}`;
    card.onclick = () => { on ? H.selected.delete(name) : H.selected.add(name); renderAll(); };
    box.appendChild(card);
  });
}
function renderModelList() {
  const box = document.getElementById("models"); box.innerHTML = "";
  // List models for whatever is selected. Disabled routes stay visible in
  // Specific mode: they are stale seeds or unpriced models, and the latter are
  // genuinely pickable once the run opts into paid routes.
  const on = [...H.selected].filter(p => routesOf(p).length);
  if (!H.selected.size) {
    box.innerHTML = `<p class="hint">Pick a harness above to choose from its models.</p>`;
    return;
  }
  if (!on.length) {
    box.innerHTML = `<p class="hint">Nothing to list yet — refresh the catalogue, or add routes for that harness with <code>harness-fleet routes add</code>.</p>`;
    return;
  }
  if (H.mode === "free") return;
  on.forEach(provider => {
    const group = document.createElement("div"); group.className = "mgroup";
    const head = document.createElement("div"); head.className = "mgroup-head";
    const free = freeOf(provider), usable = usableOf(provider), skipped = disabledCount(provider);
    head.innerHTML = `<b>${esc(provider)}</b><span class="counts">${free.length} free · ${usable.length} priced · ${skipped} unpriced</span>`;
    group.appendChild(head);
    const list = document.createElement("div"); list.className = "mlist";
    routesOf(provider).forEach(route => {
      const freeRoute = route.price_state === "price_observed_zero" && route.enabled;
      const label = document.createElement("label");
      if (!freeRoute) label.title = route.disabled_reason || "not verified free";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = H.picked.has(route.id);
      cb.onchange = () => { cb.checked ? H.picked.add(route.id) : H.picked.delete(route.id); renderSummary(); };
      label.appendChild(cb);
      const text = document.createElement("span"); text.textContent = route.id; label.appendChild(text);
      const badge = document.createElement("span"); badge.className = "badge";
      badge.textContent = freeRoute ? "free" : (route.enabled ? route.price_state : "unpriced");
      if (!freeRoute && route.disabled_reason) badge.title = route.disabled_reason;
      label.appendChild(badge);
      list.appendChild(label);
    });
    group.appendChild(list);
    box.appendChild(group);
  });
}
function renderSummary() {
  const el = document.getElementById("modelSummary");
  const selected = selectedRoutes();
  const byProvider = {};
  selected.forEach(r => { byProvider[r.provider] = (byProvider[r.provider] || 0) + 1; });
  const parts = Object.entries(byProvider).sort((a, b) => b[1] - a[1]).map(([p, n]) => `${p} ${n}`);
  if (!H.selected.size) { el.textContent = "No harness selected yet."; return; }
  if (!selected.length) { el.textContent = "No models selected."; return; }
  const unpaid = selected.filter(r => r.price_state !== "price_observed_zero").length;
  el.textContent = `${selected.length} ${H.mode === "free" ? "free" : "specific"} model(s) — ${parts.join(" · ")}`
    + (unpaid ? ` · ${unpaid} paid/unpriced (needs the run's paid opt-in)` : "");
  renderCommand();
}
function studioSelection() {
  return {
    providers: [...H.selected],
    mode: H.mode === "free" ? "free" : "specific",
    routes: H.mode === "free" ? [] : selectedRoutes().map(r => r.id),
  };
}
let saveTimer = null;
function persistSelection() {
  clearTimeout(saveTimer);
  // Never save an empty selection: the autosave fires on load and after any
  // untick, and an empty save used to wipe the stored selection.
  if (!H.selected.size) return;
  saveTimer = setTimeout(async () => {
    try { await api("PUT", "/api/settings", studioSelection()); } catch (e) { /* local-only */ }
  }, 600);
}
function renderCommand() {
  const el = document.getElementById("cmdLine");
  if (!el) return;
  el.textContent = H.selected.size && selectedRoutes().length
    ? "harness-fleet run TASK --input FILE --from-studio"
    : "";
}
function renderAll() { renderCards(); renderModelList(); renderSummary(); persistSelection(); }

async function refreshAll() {
  const msg = document.getElementById("refreshMsg");
  msg.textContent = "refreshing…";
  try {
    const r = await api("POST", "/api/routes/refresh");
    const counts = [], errors = [];
    Object.entries(r.refresh || {}).forEach(([key, value]) => {
      if (key.endsWith("_error")) errors.push([key.replace(/_error$/, ""), value]);
      else if (typeof value === "number") counts.push([key, value]);
    });
    H.refresh = {};
    counts.forEach(([key, value]) => { H.refresh[key] = `${value} model(s)`; });
    errors.forEach(([key, value]) => { H.refresh[key] = "error: " + firstLine(value, 150); });
    H.routes = (await api("GET", "/api/routes")).routes;
    const total = counts.reduce((sum, [, value]) => sum + value, 0);
    msg.textContent = `${total} reported · ${errors.length} error(s)`;
  } catch (e) {
    document.getElementById("refreshMsg").textContent = "error: " + firstLine(e.message, 120);
  }
  renderAll();
}
function watchBuild() {
  const build = H.meta && H.meta.build;
  if (!build) return;
  setInterval(async () => {
    const meta = await api("GET", "/api/meta").catch(() => null);
    if (meta && meta.build && meta.build !== build) location.reload();
  }, 4000);
}

async function load() {
  H.harnesses = (await api("GET", "/api/harnesses")).harnesses;
  H.routes = (await api("GET", "/api/routes")).routes;
  H.meta = await api("GET", "/api/meta").catch(() => null);
  // Restore what was picked last time.
  const saved = (await api("GET", "/api/settings").catch(() => null))?.settings;
  if (saved) {
    (saved.providers || []).forEach(p => H.selected.add(p));
    (saved.routes || []).forEach(r => H.picked.add(r));
    if (saved.mode) H.mode = saved.mode;
  }
  renderMeta();
  watchBuild();
  renderAll();
}
document.getElementById("modeSel").onchange = (e) => { H.mode = e.target.value; renderAll(); };
document.getElementById("refreshBtn").onclick = refreshAll;
load().catch(e => {
  document.body.insertAdjacentHTML("beforeend", `<p class="err">failed to load: ${esc(e.message)}</p>`);
});
</script>
</body>
</html>
