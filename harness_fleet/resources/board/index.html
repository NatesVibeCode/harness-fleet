<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results board</title>
<style>
  :root {
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc; --surface-3:#f2f4f7;
    --border:#e4e7ec; --border-strong:#d0d5dd;
    --text:#101828; --text-2:#475467; --muted:#98a2b3;
    --accent:#444ce7; --accent-soft:#eef2ff; --accent-line:#c7d2fe;
    --ok:#067647; --ok-soft:#ecfdf3; --ok-line:#abefc6;
    --info:#175cd3; --info-soft:#eff8ff; --info-line:#b2ddff;
    --warn:#b54708; --warn-soft:#fffaeb; --warn-line:#fedf89;
    --bad:#b42318; --bad-soft:#fef3f2; --bad-line:#fecdca;
    --radius:10px; --radius-sm:7px;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --shadow-lg:0 12px 32px rgba(16,24,40,.12);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* ---------- shell ---------- */
  .topbar { position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--border); }
  .topbar-inner { max-width:1560px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:20px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark { width:28px; height:28px; border-radius:8px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
  .brand-text { min-width:0; }
  .brand-title { font-size:15px; font-weight:650; letter-spacing:-.01em; }
  .brand-sub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spacer { flex:1; }
  .run-picker { display:flex; align-items:center; gap:8px; }
  select, input[type=search], input[type=text] {
    font:inherit; color:var(--text); background:var(--surface);
    border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:7px 10px; min-width:0;
  }
  select:focus, input:focus { outline:2px solid var(--accent-line); outline-offset:1px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface-3); color:var(--text-2); }
  .pill .dot { width:6px; height:6px; border-radius:50%; background:var(--muted); }
  .pill.ok { background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok); }
  .pill.ok .dot { background:var(--ok); }
  .pill.warn { background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn); }
  .pill.warn .dot { background:var(--warn); }
  .pill.bad { background:var(--bad-soft); border-color:var(--bad-line); color:var(--bad); }
  .pill.bad .dot { background:var(--bad); }

  .layout { max-width:1560px; margin:0 auto; padding:22px 24px 80px; display:grid; grid-template-columns:236px minmax(0,1fr); gap:22px; align-items:start; }
  @media (max-width:1080px) { .layout { grid-template-columns:1fr; } }

  /* ---------- sidebar ---------- */
  .sidebar { position:sticky; top:76px; display:flex; flex-direction:column; gap:16px; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button { display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:transparent; border:0; border-radius:var(--radius-sm); padding:8px 10px; font-size:13.5px; font-weight:550; color:var(--text-2); }
  .nav button:hover { background:var(--surface-3); color:var(--text); }
  .nav button[aria-selected=true] { background:var(--accent-soft); color:var(--accent); }
  .nav .count { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
  .nav button[aria-selected=true] .count { color:var(--accent); }

  .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .panel-head { padding:11px 13px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .panel-title { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .panel-body { padding:13px; }

  .field { margin-bottom:11px; }
  .field:last-child { margin-bottom:0; }
  .field-label { font-size:11px; font-weight:650; color:var(--text-2); margin-bottom:5px; letter-spacing:.02em; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface); font-size:12px; font-weight:550; color:var(--text-2); }
  .chip .n { color:var(--muted); font-variant-numeric:tabular-nums; font-size:11px; }
  .chip[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip[aria-pressed=true] .n { color:rgba(255,255,255,.75); }
  .linkbtn { background:none; border:0; padding:0; color:var(--accent); font-size:12px; font-weight:600; }

  /* ---------- stats ---------- */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:12px; margin-bottom:18px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow); }
  .stat .k { font-size:11px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .stat .v { font-size:24px; font-weight:660; letter-spacing:-.02em; margin-top:4px; font-variant-numeric:tabular-nums; }
  .stat .s { font-size:12px; color:var(--muted); margin-top:2px; }

  /* ---------- section ---------- */
  .section { margin-bottom:18px; }
  .section-head { display:flex; align-items:flex-end; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .section-title { font-size:18px; font-weight:650; letter-spacing:-.015em; margin:0; }
  .section-sub { font-size:12.5px; color:var(--muted); }
  .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar input[type=search] { min-width:220px; }

  /* ---------- table ---------- */
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:auto; max-height:calc(100vh - 300px); }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
  thead th { position:sticky; top:0; z-index:2; background:var(--surface-2); text-align:left; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.sortable { cursor:pointer; user-select:none; }
  thead th.sortable:hover { color:var(--text-2); }
  thead th .arrow { opacity:.45; font-size:10px; }
  tbody td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr.row { cursor:pointer; }
  tbody tr.row:hover { background:var(--surface-2); }
  tbody tr.row[aria-selected=true] { background:var(--accent-soft); }
  .sticky-col { position:sticky; left:0; background:var(--surface); z-index:1; border-right:1px solid var(--border); min-width:190px; }
  tbody tr.row:hover .sticky-col { background:var(--surface-2); }
  tbody tr.row[aria-selected=true] .sticky-col { background:var(--accent-soft); }
  .cell-name { font-weight:600; letter-spacing:-.01em; }
  .cell-sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .cell-text { max-width:280px; color:var(--text-2); }
  .num { font-variant-numeric:tabular-nums; }
  .empty-value { color:var(--muted); font-style:italic; font-size:12.5px; }
  .score-cell { display:flex; flex-direction:column; gap:4px; min-width:74px; }
  .score-num { font-weight:660; font-variant-numeric:tabular-nums; }
  .bar { height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  .bar.ok > span { background:var(--ok); }
  .bar.info > span { background:var(--info); }
  .bar.warn > span { background:var(--warn); }
  .bar.bad > span { background:var(--bad); }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:650; border:1px solid var(--border); background:var(--surface-3); color:var(--text-2); white-space:nowrap; }
  .tag.tier_1 { background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok); }
  .tag.tier_2 { background:var(--info-soft); border-color:var(--info-line); color:var(--info); }
  .tag.tier_3 { background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn); }
  .tag.unfit { background:var(--bad-soft); border-color:var(--bad-line); color:var(--bad); }
  .tag.soft { background:var(--surface-3); color:var(--text-2); font-weight:550; }
  .tag.mini { font-size:11px; padding:1px 7px; }

  /* ---------- cards / grid ---------- */
  .cols { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:18px; align-items:start; }
  @media (max-width:980px) { .cols { grid-template-columns:1fr; } }
  .list { display:flex; flex-direction:column; }
  .list-row { display:flex; align-items:center; gap:12px; padding:10px 13px; border-bottom:1px solid var(--border); }
  .list-row:last-child { border-bottom:0; }
  .list-label { flex:1; min-width:0; }
  .list-label .t { font-size:13px; font-weight:600; }
  .list-label .d { font-size:12px; color:var(--muted); margin-top:1px; }
  .list-metric { width:64px; text-align:right; font-size:13px; font-weight:650; font-variant-numeric:tabular-nums; }
  .list-bar { width:120px; }
  @media (max-width:620px) { .list-bar { display:none; } }

  .stack { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--surface-3); }
  .stack > div { height:100%; }
  .legend { display:flex; flex-direction:column; margin-top:12px; }
  .legend-row { display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .legend-row:last-child { border-bottom:0; }
  .swatch { width:10px; height:10px; border-radius:3px; flex:none; }
  .legend-row .n { margin-left:auto; font-weight:650; font-variant-numeric:tabular-nums; }
  .legend-row .r { color:var(--muted); font-size:12px; min-width:74px; text-align:right; }

  dl.attrs { margin:0; display:grid; grid-template-columns:minmax(120px,190px) minmax(0,1fr); }
  dl.attrs dt { padding:9px 12px 9px 0; font-size:12.5px; font-weight:600; color:var(--text-2); border-bottom:1px solid var(--border); }
  dl.attrs dd { margin:0; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; min-width:0; }
  dl.attrs dt:last-of-type, dl.attrs dd:last-of-type { border-bottom:0; }
  .kv { display:flex; flex-direction:column; gap:2px; }
  .kv .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; font-weight:650; }

  blockquote.quote { margin:0 0 10px; padding:11px 13px; background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--accent-line); border-radius:var(--radius-sm); }
  blockquote.quote:last-child { margin-bottom:0; }
  blockquote.quote p { margin:0 0 8px; font-size:13px; }
  .quote-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
  .quote-meta code, .mono { font-family:var(--mono); font-size:11.5px; color:var(--text-2); }

  /* ---------- kanban ---------- */
  .kanban { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; align-items:start; }
  @media (max-width:1080px) { .kanban { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:680px) { .kanban { grid-template-columns:1fr; } }
  .kanban-col { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:10px; min-height:120px; }
  .kanban-head { display:flex; align-items:center; gap:8px; padding:2px 2px 10px; border-bottom:1px solid var(--border); margin-bottom:10px; }
  .lane-count { font-size:12px; font-weight:650; color:var(--text-2); background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:1px 8px; font-variant-numeric:tabular-nums; }
  .kanban-empty { font-size:12.5px; color:var(--muted); font-style:italic; padding:10px 4px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 11px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow); }
  .card:last-child { margin-bottom:0; }
  .card:hover { border-color:var(--border-strong); }
  .card[aria-selected=true] { border-color:var(--accent); background:var(--accent-soft); }
  .card-top { display:flex; align-items:baseline; gap:8px; }
  .card-top .score-num { margin-left:auto; font-size:15px; }
  .card-practice { font-size:12.5px; color:var(--text-2); margin-top:4px; }
  .card-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }

  /* ---------- drawer ---------- */
  .drawer-backdrop { position:fixed; inset:0; background:rgba(16,24,40,.28); opacity:0; pointer-events:none; transition:opacity .16s ease; z-index:40; }
  .drawer-backdrop.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100vh; width:min(660px,94vw); background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg); transform:translateX(101%); transition:transform .19s ease; z-index:41; display:flex; flex-direction:column; }
  .drawer.open { transform:none; }
  .drawer-head { padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:14px; }
  .drawer-title { font-size:17px; font-weight:660; letter-spacing:-.015em; margin:0 0 4px; }
  .iconbtn { border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); width:30px; height:30px; display:grid; place-items:center; color:var(--text-2); flex:none; }
  .iconbtn:hover { background:var(--surface-3); }
  .drawer-body { overflow:auto; padding:16px 18px 40px; }
  .drawer-foot { border-top:1px solid var(--border); padding:10px 18px; font-size:12px; color:var(--muted); background:var(--surface-2); }
  .q-list { display:flex; flex-direction:column; }
  .q { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); align-items:start; }
  .q:last-child { border-bottom:0; }
  .q-mark { width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; margin-top:1px; }
  .q-mark.yes { background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok-line); }
  .q-mark.no { background:var(--surface-3); color:var(--muted); border:1px solid var(--border); }
  .q-text { min-width:0; }
  .q-text .t { font-size:13px; font-weight:600; }
  .q-text .d { font-size:12px; color:var(--muted); margin-top:1px; }
  .q-text .why { font-size:12px; color:var(--text-2); margin-top:4px; padding-left:9px; border-left:2px solid var(--border); }
  .q-pts { font-size:12px; font-weight:650; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .q-pts.earned { color:var(--ok); }

  .state { padding:36px 20px; text-align:center; color:var(--muted); font-size:13.5px; }
  .state strong { display:block; color:var(--text-2); font-size:15px; margin-bottom:4px; }
  .nowrap { white-space:nowrap; }
  details.raw { margin-top:10px; }
  details.raw summary { cursor:pointer; font-size:12px; color:var(--text-2); font-weight:600; }
  details.raw pre { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; overflow:auto; font-family:var(--mono); font-size:11.5px; margin:8px 0 0; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">HF</div>
      <div class="brand-text">
        <div class="brand-title" id="brandTitle">Results board</div>
        <div class="brand-sub" id="runSub">loading…</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="run-picker">
      <label for="runSelect" class="brand-sub">Run</label>
      <select id="runSelect" aria-label="Select run"></select>
      <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">—</span></span>
      <span class="pill" title="This board never writes to the database.">Read-only</span>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="nav" id="nav" role="tablist" aria-label="Views"></nav>

    <div class="panel">
      <div class="panel-head"><span class="panel-title">Filters</span><span class="spacer"></span>
        <button class="linkbtn" id="clearFilters" hidden>Clear</button></div>
      <div class="panel-body" id="filterBody"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><span class="panel-title">Evidence key</span></div>
      <div class="panel-body" style="font-size:12.5px;color:var(--text-2)">
        Every claim here is backed by a quote verified character-exact against the fetched source.
        A dash means the source never stated it — nothing on this page is inferred or filled in.
      </div>
    </div>
  </aside>

  <main id="main"><div class="state">Loading run…</div></main>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Partner detail">
  <div id="drawerContent" style="display:flex;flex-direction:column;height:100%"></div>
</aside>

<script>
(function () {
  "use strict";
  var STATE = { payload:null, runs:[], view:"partners", query:"", tiers:new Set(), facets:{}, sort:{key:"score", dir:-1}, selected:null };

  var TIER_COLOR = { tier_1:"var(--ok)", tier_2:"var(--info)", tier_3:"var(--warn)", unfit:"var(--bad)" };

  /* What this run's rows are called, taken from the run's own task name rather
     than hardcoded to one product: a partner run shows partners, an account run
     accounts, a career run roles. The board is a viewer for every task. */
  var NOUNS = { partner:["Partner","Partners","Practice"], account:["Account","Accounts","Gap"], career:["Role","Roles","Role"] };
  function recordNoun() {
    var task = String(((STATE.payload || {}).run || {}).task || "").toLowerCase();
    for (var key in NOUNS) { if (task.indexOf(key) === 0) return { one:NOUNS[key][0], many:NOUNS[key][1], detail:NOUNS[key][2] }; }
    return { one:"Record", many:"Records", detail:"Detail" };
  }
  var TIER_LABEL = { tier_1:"Tier 1", tier_2:"Tier 2", tier_3:"Tier 3", unfit:"Unfit" };

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : String(v));
    });
    (kids || []).forEach(function (kid) {
      if (kid === null || kid === undefined || kid === false) return;
      node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    });
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function pct(part, whole) { return whole ? Math.round((part / whole) * 100) : 0; }
  function scoreClass(tier) { return ({ tier_1:"ok", tier_2:"info", tier_3:"warn", unfit:"bad" })[tier] || ""; }
  // An unscored row has no tier: without the fallback the class would be
  // "tier_null" (or "tier_None"), which no rule styles.
  function tierTagClass(tier) { return "tag " + (tier ? "tier_" + tier : "soft"); }
  function isPlainObject(v) { return !!v && typeof v === "object" && !Array.isArray(v); }
  function isEmptyValue(v) {
    if (v === null || v === undefined) return true;
    if (typeof v === "string") return v.trim() === "";
    if (Array.isArray(v)) return v.length === 0;
    if (isPlainObject(v)) return Object.keys(v).every(function (k) { return isEmptyValue(v[k]); });
    return false;
  }
  function fmtValue(v) {
    if (v === null || v === undefined || v === "") return "—";
    if (Array.isArray(v)) return v.join(" · ");
    if (isPlainObject(v)) {
      // Nested objects show only the parts the source actually stated.
      var parts = Object.keys(v)
        .filter(function (k) { return !isEmptyValue(v[k]); })
        .map(function (k) { return k.replace(/_/g, " ") + ": " + fmtValue(v[k]); });
      return parts.length ? parts.join(" · ") : "—";
    }
    if (typeof v === "boolean") return v ? "yes" : "no";
    return String(v);
  }
  function dashText(v) {
    return isEmptyValue(v) ? el("span", { class:"empty-value", text:"not stated in source" }) : el("span", { text:fmtValue(v) });
  }
  function shortTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  /* ---------------- filters ---------------- */
  function partnerMatches(p) {
    if (STATE.tiers.size && !STATE.tiers.has(p.tier)) return false;
    var q = STATE.query.trim().toLowerCase();
    if (q) {
      var hay = [p.id, p.name, p.practice, p.reasoning, JSON.stringify(p.answers || {})].join(" ").toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    for (var key in STATE.facets) {
      var want = STATE.facets[key];
      if (!want || !want.size) continue;
      var v = (p.answers || {})[key];
      var vals = Array.isArray(v) ? v : (v === null || v === undefined || v === "" ? [] : [v]);
      if (!vals.some(function (x) { return want.has(String(x)); })) return false;
    }
    return true;
  }
  function visiblePartners() { return (STATE.payload.partners || []).filter(partnerMatches); }
  function activeFilterCount() {
    var n = STATE.tiers.size + (STATE.query.trim() ? 1 : 0);
    Object.keys(STATE.facets).forEach(function (k) { n += STATE.facets[k].size; });
    return n;
  }
  function toggleSet(set, value) { if (set.has(value)) set.delete(value); else set.add(value); }

  /* ---------------- views ---------------- */
  var VIEWS = [
    { id:"partners", label:"Records" },
    { id:"pipeline", label:"Pipeline" },
    { id:"scorecard", label:"Scorecard" },
    { id:"evidence", label:"Evidence" },
    { id:"run", label:"Run detail" },
    { id:"list", label:"Running list" }
  ];

  function renderNav() {
    var nav = document.getElementById("nav"), p = STATE.payload;
    clear(nav);
    if (!p) return;
    var counts = {
      partners: visiblePartners().length + "/" + (p.partners || []).length,
      pipeline: Object.keys(p.stats.tier_counts).length + " stages",
      scorecard: (p.checklist || []).length + " q",
      evidence: String(p.stats.quote_count),
      run: p.stats.batches_verified + "/" + p.stats.batches_total,
      list: String(((p.ledger || {}).counts || {}).entities || 0)
    };
    VIEWS.forEach(function (v) {
      nav.appendChild(el("button", {
        type:"button", role:"tab", "aria-selected": STATE.view === v.id,
        onclick: function () { STATE.view = v.id; render(); }
      }, [el("span", { text:v.label }), el("span", { class:"count", text:counts[v.id] })]));
    });
  }

  function renderFilters() {
    var body = document.getElementById("filterBody"), p = STATE.payload;
    clear(body);
    document.getElementById("clearFilters").hidden = activeFilterCount() === 0;
    if (!p) return;

    var tierField = el("div", { class:"field" }, [el("div", { class:"field-label", text:"Fit tier" })]);
    var tierChips = el("div", { class:"chips" });
    (p.tiers || []).forEach(function (t) {
      var n = (p.partners || []).filter(function (x) { return x.tier === t.tier; }).length;
      tierChips.appendChild(el("button", {
        class:"chip", type:"button", "aria-pressed": STATE.tiers.has(t.tier),
        onclick: function () { toggleSet(STATE.tiers, t.tier); render(); }
      }, [el("span", { class:"swatch", style:"background:" + (TIER_COLOR[t.tier] || "var(--muted)") }), TIER_LABEL[t.tier] || t.tier, el("span", { class:"n", text:n })]));
    });
    tierField.appendChild(tierChips);
    body.appendChild(tierField);

    var interesting = (p.attributes || []).filter(function (a) { return Object.keys(p.facets[a.key] || {}).length > 1; });
    interesting.slice(0, 6).forEach(function (a) {
      var field = el("div", { class:"field" }, [el("div", { class:"field-label", text:a.label })]);
      var chips = el("div", { class:"chips" });
      var facet = p.facets[a.key];
      var chosen = STATE.facets[a.key] || (STATE.facets[a.key] = new Set());
      Object.keys(facet).sort(function (x, y) { return facet[y] - facet[x]; }).slice(0, 8).forEach(function (value) {
        chips.appendChild(el("button", {
          class:"chip", type:"button", "aria-pressed": chosen.has(value), title:value,
          onclick: function () { toggleSet(chosen, value); render(); }
        }, [el("span", { text:value.length > 24 ? value.slice(0, 23) + "…" : value }), el("span", { class:"n", text:facet[value] })]));
      });
      field.appendChild(chips);
      body.appendChild(field);
    });
    if (!interesting.length) {
      body.appendChild(el("div", { class:"empty-value", text:"No attribute has more than one value in this run yet." }));
    }
  }

  function statCard(k, v, sub) {
    return el("div", { class:"stat" }, [
      el("div", { class:"k", text:k }),
      el("div", { class:"v", text:v }),
      sub ? el("div", { class:"s", text:sub }) : null
    ]);
  }

  function renderHeader() {
    var p = STATE.payload, s = p.stats;
    document.getElementById("main").appendChild(el("div", { class:"stats" }, [
      statCard(recordNoun().many, String(s.records), s.scored + " scored · " + s.unscored + " unscored"),
      statCard("Average score", s.average_score === null ? "—" : String(s.average_score), "best " + (s.best_score === null ? "—" : s.best_score) + " / " + p.checklist_total),
      statCard("Tier 1 / 2", (s.tier_counts.tier_1 || 0) + " / " + (s.tier_counts.tier_2 || 0), (s.tier_counts.tier_3 || 0) + " tier 3 · " + (s.tier_counts.unfit || 0) + " unfit"),
      statCard("Evidence-capped tiers", String(s.tier_capped || 0), (s.lone_claims || 0) + " claim(s) stand alone"),
      statCard("Verified quotes", String(s.quote_count), s.records_with_quotes + " of " + s.records + " " + recordNoun().many.toLowerCase() + " cited"),
      statCard("Route cost", "$" + Number(s.cost_reported || 0).toFixed(6), (s.routes || []).length + " price-verified route(s)"),
      statCard("Batches", s.batches_verified + "/" + s.batches_total, s.batches_failed ? s.batches_failed + " failed" : "all quotes verified")
    ]));
  }

  /* ---------------- records table ---------------- */
  function sortValue(partner, key) {
    if (key === "score") return partner.score;
    if (key === "id") return partner.id;
    if (key === "practice") return partner.practice;
    return (partner.answers || {})[key];
  }
  function sortPartners(rows) {
    var key = STATE.sort.key, dir = STATE.sort.dir;
    return rows.slice().sort(function (a, b) {
      var av = sortValue(a, key), bv = sortValue(b, key);
      var an = typeof av === "number" ? av : (isEmptyValue(av) ? -Infinity : String(av).toLowerCase());
      var bn = typeof bv === "number" ? bv : (isEmptyValue(bv) ? -Infinity : String(bv).toLowerCase());
      if (an < bn) return -1 * dir;
      if (an > bn) return 1 * dir;
      return String(a.id).localeCompare(String(b.id));
    });
  }

  function headerCell(label, key, extraClass) {
    var sorted = STATE.sort.key === key;
    return el("th", {
      class:"sortable " + (extraClass || ""), scope:"col",
      "aria-sort": sorted ? (STATE.sort.dir === 1 ? "ascending" : "descending") : "none",
      onclick: function () {
        if (STATE.sort.key === key) STATE.sort.dir = -STATE.sort.dir;
        else { STATE.sort.key = key; STATE.sort.dir = key === "score" ? -1 : 1; }
        renderTable();
      }
    }, [label + " ", el("span", { class:"arrow", text: sorted ? (STATE.sort.dir === 1 ? "▲" : "▼") : "↕" })]);
  }

  function renderPartners() {
    var p = STATE.payload, main = document.getElementById("main");
    var search = el("input", { type:"search", placeholder:"Search " + recordNoun().one.toLowerCase() + ", " + recordNoun().detail.toLowerCase() + ", evidence…", value:STATE.query, "aria-label":"Search rows" });
    search.addEventListener("input", function () {
      STATE.query = search.value;
      renderNav();
      document.getElementById("clearFilters").hidden = activeFilterCount() === 0;
      renderTable();
    });
    main.appendChild(el("section", { class:"section" }, [
      el("div", { class:"section-head" }, [
        el("h2", { class:"section-title", text:"Ranked " + recordNoun().many.toLowerCase() }),
        el("span", { class:"section-sub", text:"ranked by score · click a row for the full dossier" })
      ]),
      el("div", { class:"toolbar" }, [
        search,
        el("span", { class:"section-sub", id:"rowCount", text:"" }),
        el("span", { class:"spacer" }),
        el("span", { class:"section-sub", text:"every column is a field this task asked for" })
      ]),
      el("div", { id:"tableHost" })
    ]));
    renderTable();
  }

  function renderTable() {
    var p = STATE.payload, host = document.getElementById("tableHost");
    if (!host) return;
    clear(host);
    var rows = sortPartners(visiblePartners());
    var countNode = document.getElementById("rowCount");
    if (countNode) countNode.textContent = rows.length + " of " + (p.partners || []).length + " " + recordNoun().many.toLowerCase();

    if (!rows.length) {
      host.appendChild(el("div", { class:"table-wrap" }, [
        el("div", { class:"state" }, [
          el("strong", { text:"No " + recordNoun().one.toLowerCase() + " matches these filters" }),
          el("span", { text:"Clear a filter or widen the search to see the rest of the run." })
        ])
      ]));
      return;
    }

    // Most-consulted columns first; the long attribute tail scrolls horizontally.
    var head = el("tr", null, [
      headerCell(recordNoun().one, "id", "sticky-col"),
      headerCell("Score", "score"),
      el("th", { scope:"col", text:"Tier" }),
      headerCell(recordNoun().detail, "practice")
    ]);
    (p.attributes || []).forEach(function (a) { head.appendChild(headerCell(a.label, a.key)); });
    head.appendChild(el("th", { scope:"col", text:"Evidence" }));

    var body = el("tbody");
    rows.forEach(function (partner) {
      var cells = [
        el("td", { class:"sticky-col" }, [
          el("div", { class:"cell-name", text: partner.name || partner.id }),
          el("div", { class:"cell-sub", text: (partner.quotes || []).length + " quote(s) · " + ((partner.provenance || {}).route || "no route") })
        ]),
        el("td", null, [
          el("div", { class:"score-cell" }, [
            el("span", { class:"score-num", text: partner.score === null ? "—" : partner.score + " / " + p.checklist_total }),
            el("span", { class:"bar " + scoreClass(partner.tier), style:"width:74px" }, [
              // A score is points out of this run's checklist total, not a
              // percent: 45 of 60 fills the bar, not under half of it.
              el("span", { style:"width:" + (partner.score === null ? 0 : Math.max(2, pct(partner.score, p.checklist_total))) + "%" })
            ])
          ])
        ]),
        tierCell(partner),
        el("td", null, [el("div", { class:"cell-text", text:partner.practice || "—" })])
      ];
      (p.attributes || []).forEach(function (a) {
        var value = (partner.answers || {})[a.key];
        if (isEmptyValue(value)) cells.push(el("td", null, [el("span", { class:"empty-value", text:"—" })]));
        else if (Array.isArray(value)) {
          cells.push(el("td", null, [el("div", { class:"chips" },
            value.slice(0, 3).map(function (v) { return el("span", { class:"tag soft mini", text:String(v).slice(0, 44) }); })
              .concat(value.length > 3 ? [el("span", { class:"empty-value", text:"+" + (value.length - 3) })] : [])
          )]));
        } else cells.push(el("td", null, [el("div", { class:"cell-text", text:fmtValue(value) })]));
      });
      var lone = ((partner.evidence || {}).contradictions || []).length;
      cells.push(el("td", null, [
        el("div", { class:"cell-sub", text:(partner.quotes || []).length + " quote(s)" }),
        el("div", { class:"cell-sub", text:partner.source && partner.source.uri ? "source linked" : "no source uri" }),
        evidenceChips(partner.evidence, 3),
        lone ? el("div", { class:"cell-sub", style:"color:var(--warn)", text:lone + " claim(s) stand alone" }) : null
      ]));
      body.appendChild(el("tr", {
        class:"row", "aria-selected": STATE.selected === partner.id,
        onclick: function () { openDrawer(partner.id); }
      }, cells));
    });

    host.appendChild(el("div", { class:"table-wrap" }, [el("table", null, [el("thead", null, [head]), body])]));
  }

  /* ---------------- pipeline (kanban) ---------------- */
  function renderPipeline() {
    var p = STATE.payload, main = document.getElementById("main");
    var rows = visiblePartners();
    var order = ["tier_1", "tier_2", "tier_3", "unfit"];
    var tiersByKey = {};
    (p.tiers || []).forEach(function (t) { tiersByKey[t.tier] = t.min_score; });

    var board = el("div", { class:"kanban" });
    order.forEach(function (tier) {
      var cards = rows.filter(function (x) { return x.tier === tier; })
        .sort(function (a, b) { return (b.score === null ? -1 : b.score) - (a.score === null ? -1 : a.score); });
      var range = tier === "tier_1" ? (tiersByKey.tier_1 || 85) + "–100"
        : tier === "tier_2" ? (tiersByKey.tier_2 || 70) + "–" + ((tiersByKey.tier_1 || 85) - 1)
        : tier === "tier_3" ? (tiersByKey.tier_3 || 50) + "–" + ((tiersByKey.tier_2 || 70) - 1)
        : "below " + (tiersByKey.tier_3 || 50);
      var column = el("div", { class:"kanban-col" }, [
        el("div", { class:"kanban-head" }, [
          el("span", { class:"swatch", style:"background:" + TIER_COLOR[tier] }),
          el("span", { style:"font-weight:650", text:TIER_LABEL[tier] }),
          el("span", { class:"section-sub", text:range }),
          el("span", { class:"spacer" }),
          el("span", { class:"lane-count", text:cards.length })
        ])
      ]);
      if (!cards.length) {
        column.appendChild(el("div", { class:"kanban-empty", text:"No " + recordNoun().one.toLowerCase() + " in this stage for the current filters." }));
      } else {
        cards.forEach(function (partner) {
          column.appendChild(el("div", {
            class:"card", "aria-selected": STATE.selected === partner.id,
            onclick: function () { openDrawer(partner.id); }
          }, [
            el("div", { class:"card-top" }, [
              el("span", { class:"cell-name", text:partner.name || partner.id }),
              el("span", { class:"score-num", text:partner.score === null ? "—" : partner.score })
            ]),
            el("div", { class:"card-practice", text: partner.practice || ("no verified " + recordNoun().detail.toLowerCase() + " named") }),
            el("div", { class:"card-tags" }, [
              el("span", { class:"tag soft mini", text:(partner.quotes || []).length + " quotes" }),
              partner.source && partner.source.uri ? el("span", { class:"tag soft mini", text:"source linked" }) : null,
              el("span", { class:"tag soft mini", text:topAttribute(partner, p) })
            ])
          ]));
        });
      }
      board.appendChild(column);
    });

    main.appendChild(el("section", { class:"section" }, [
      el("div", { class:"section-head" }, [
        el("h2", { class:"section-title", text:"Pipeline" }),
        el("span", { class:"section-sub", text:recordNoun().many.toLowerCase() + " grouped by the tier the scoring policy gave them · click a card for the dossier" })
      ]),
      board
    ]));

    var unscored = rows.filter(function (x) { return x.tier === null || x.tier === undefined; });
    if (unscored.length) {
      main.appendChild(el("div", { class:"panel" }, [
        el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Unscored" })]),
        el("div", { class:"list" }, unscored.map(function (partner) {
          return el("div", { class:"list-row" }, [
            el("div", { class:"list-label" }, [el("div", { class:"t", text:partner.name || partner.id })]),
            el("div", { class:"list-metric", text:"—" })
          ]);
        }))
      ]));
    }
  }

  function topAttribute(partner, p) {
    // The first attribute with a value, so a card says something specific.
    var attrs = p.attributes || [];
    for (var i = 0; i < attrs.length; i++) {
      var value = (partner.answers || {})[attrs[i].key];
      if (isEmptyValue(value)) continue;
      var text = fmtValue(value);
      return attrs[i].label + ": " + (text.length > 34 ? text.slice(0, 33) + "…" : text);
    }
    return "no attributes filled";
  }

  /* ---------------- scorecard ---------------- */
  function renderScorecard() {
    var p = STATE.payload, main = document.getElementById("main");
    var records = p.stats.records || 0;

    var coverage = el("div", { class:"panel" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Checklist coverage" }),
        el("span", { class:"spacer" }), el("span", { class:"section-sub", text:recordNoun().many.toLowerCase() + " passing" })]),
      el("div", { class:"list" }, (p.checklist || []).map(function (c) {
        return el("div", { class:"list-row" }, [
          el("div", { class:"list-label" }, [
            el("div", { class:"t", text:c.label }),
            el("div", { class:"d", text:c.description || "" })
          ]),
          el("div", { class:"list-bar" }, [el("span", { class:"bar " + (c.passed >= records * 0.6 ? "ok" : (c.passed ? "warn" : "bad")), style:"display:block" }, [
            el("span", { style:"width:" + pct(c.passed, records) + "%" })
          ])]),
          el("div", { class:"list-metric", text:c.passed + "/" + records }),
          el("div", { class:"list-metric", style:"color:var(--muted)", text:c.points + " pts" })
        ]);
      }))
    ]);

    var tierOrder = ["tier_1", "tier_2", "tier_3", "unfit"];
    var total = (p.partners || []).length || 1;
    var tiersByKey = {};
    (p.tiers || []).forEach(function (t) { tiersByKey[t.tier] = t.min_score; });
    var stack = el("div", { class:"stack" }, tierOrder.map(function (t) {
      var n = p.stats.tier_counts[t] || 0;
      return el("div", { style:"width:" + pct(n, total) + "%;background:" + TIER_COLOR[t], title:TIER_LABEL[t] + ": " + n });
    }));
    var legend = el("div", { class:"legend" }, tierOrder.map(function (t) {
      var n = p.stats.tier_counts[t] || 0;
      var range = t === "tier_1" ? (tiersByKey.tier_1 || 85) + "–100"
        : t === "tier_2" ? (tiersByKey.tier_2 || 70) + "–" + ((tiersByKey.tier_1 || 85) - 1)
        : t === "tier_3" ? (tiersByKey.tier_3 || 50) + "–" + ((tiersByKey.tier_2 || 70) - 1)
        : "below " + (tiersByKey.tier_3 || 50);
      return el("div", { class:"legend-row" }, [
        el("span", { class:"swatch", style:"background:" + TIER_COLOR[t] }),
        el("span", { text:TIER_LABEL[t] }),
        el("span", { class:"r", text:range }),
        el("span", { class:"n", text:n + " · " + pct(n, total) + "%" })
      ]);
    }));

    var scored = (p.partners || []).filter(function (x) { return x.score !== null; });
    var avgEarned = scored.length ? Math.round(scored.reduce(function (a, b) { return a + b.earned_points; }, 0) / scored.length) : 0;

    var tiersPanel = el("div", { class:"panel" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Score distribution" })]),
      el("div", { class:"panel-body" }, [
        stack, legend,
        el("div", { class:"section-sub", style:"margin-top:12px", text:"Average " + avgEarned + " of " + p.checklist_total + " points across " + scored.length + " scored " + recordNoun().many.toLowerCase() + ". Bands come from the scoring policy, not this page." })
      ])
    ]);

    var attrs = el("div", { class:"panel", style:"margin-top:18px" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Attributes captured" }),
        el("span", { class:"spacer" }), el("span", { class:"section-sub", text:"filled / " + recordNoun().many.toLowerCase() + " · distinct values" })]),
      el("div", { class:"list" }, (p.attributes || []).map(function (a) {
        var facet = p.facets[a.key] || {};
        var values = Object.keys(facet).sort(function (x, y) { return facet[y] - facet[x]; });
        var filled = (p.partners || []).filter(function (x) { return !isEmptyValue((x.answers || {})[a.key]); }).length;
        var fillText = filled + "/" + p.stats.records + (filled ? "" : " — nothing stated");
        return el("div", { class:"list-row" }, [
          el("div", { class:"list-label" }, [
            el("div", { class:"t", text:a.label }),
            el("div", { class:"d", text:a.description || "" }),
            values.length
              ? el("div", { class:"chips", style:"margin-top:6px" }, values.slice(0, 8).map(function (v) {
                  return el("span", { class:"tag soft mini", text:v.length > 40 ? v.slice(0, 39) + "…" : v });
                }))
              : el("div", { class:"empty-value", style:"margin-top:6px", text:"no value in any source" })
          ]),
          el("div", { class:"list-metric", style: filled ? "" : "color:var(--muted);font-weight:550", text:fillText }),
          el("div", { class:"list-metric", style:"color:var(--muted)", text:values.length + " val" })
        ]);
      }))
    ]);

    main.appendChild(el("div", { class:"cols" }, [coverage, tiersPanel]));
    main.appendChild(attrs);
  }

  /* ---------------- evidence ---------------- */
  function provRow(k, v) {
    return el("div", { class:"list-row" }, [
      el("div", { class:"list-label" }, [el("div", { class:"t", text:k })]),
      el("div", { class:"list-metric", style:"width:auto;text-align:right;max-width:58%;word-break:break-word", text:v })
    ]);
  }

  function renderEvidence() {
    var p = STATE.payload, main = document.getElementById("main");
    var rows = visiblePartners().filter(function (x) { return (x.quotes || []).length; });

    var body = rows.length ? rows.map(function (partner) {
      return el("div", { style:"margin-bottom:18px" }, [
        el("div", { style:"display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap" }, [
          el("span", { class:"cell-name", text:partner.name || partner.id }),
          // An unscored row has no tier: without the fallback the class is
          // "tier_null", which no rule styles, so the tag renders unstyled.
          el("span", { class:tierTagClass(partner.tier), text:TIER_LABEL[partner.tier] || "—" }),
          partner.source && partner.source.uri
            ? el("a", { href:partner.source.uri, target:"_blank", rel:"noopener noreferrer", text:"open source" })
            : el("span", { class:"empty-value", text:"input had no source_uri" })
        ])
      ].concat((partner.quotes || []).map(function (q) {
        return el("blockquote", { class:"quote" }, [
          el("p", { text:"“" + q.text + "”" }),
          el("div", { class:"quote-meta" }, [
            el("span", { text:(q.supports || []).length ? "supports" : "unsupported" }),
            el("span", { class:"chips" }, (q.supports || []).slice(0, 6).map(function (s) {
              var item = (p.checklist || []).filter(function (c) { return c.item_id === s; })[0];
              return el("span", { class:"tag soft mini", text:item ? item.label : s });
            })),
            el("span", { class:"mono", text:"chars " + q.start + "–" + q.end })
          ])
        ]);
      })));
    }) : [el("div", { class:"state" }, [
      el("strong", { text:"No quotes for the current filter" }),
      el("span", { text:"Every claim needs one; widen the filters to see them." })
    ])];

    var feed = el("div", { class:"panel" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Quote ledger" }),
        el("span", { class:"spacer" }), el("span", { class:"section-sub", text:p.stats.quote_count + " verified character-exact" })]),
      el("div", { class:"panel-body" }, body)
    ]);

    var prov = el("div", { class:"panel" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Provenance" })]),
      el("div", { class:"list" }, [
        provRow("Run", p.run.run_id),
        provRow("Task revision", p.run.task_revision || "not recorded"),
        provRow("Records", p.stats.records + " items · " + p.stats.quote_count + " quotes"),
        provRow("Batches verified", p.stats.batches_verified + " of " + p.stats.batches_total + (p.stats.batches_failed ? " · " + p.stats.batches_failed + " failed" : "")),
        provRow("Attempts used", String(p.stats.attempts_used)),
        provRow("Routes", (p.stats.routes || []).join(", ") || "—"),
        provRow("Reported cost", "$" + Number(p.stats.cost_reported || 0).toFixed(6)),
        provRow("Started", shortTime(p.run.created_at)),
        provRow("Finished", shortTime(p.run.finished_at))
      ])
    ]);

    main.appendChild(el("div", { class:"cols" }, [feed, prov]));
  }

  /* ---------------- run detail ---------------- */
  function renderRun() {
    var p = STATE.payload, main = document.getElementById("main"), s = p.stats;

    var info = el("div", { class:"panel" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Run" })]),
      el("div", { class:"panel-body" }, [
        el("dl", { class:"attrs" }, [
          el("dt", { text:"Run id" }), el("dd", { class:"mono", text:p.run.run_id }),
          el("dt", { text:"Status" }), el("dd", null, [el("span", { class:"pill " + (p.run.status === "completed" ? "ok" : "warn") }, [el("span", { class:"dot" }), p.run.status])]),
          el("dt", { text:"Task" }), el("dd", { text:p.run.task || "—" }),
          el("dt", { text:"Task revision" }), el("dd", { class:"mono", text:p.run.task_revision || "not recorded in this snapshot" }),
          el("dt", { text:"Input" }), el("dd", { class:"mono", text:p.run.input_path || "—" }),
          el("dt", { text:"Items" }), el("dd", { text:p.run.total_items + " · " + s.scored + " scored · " + s.unscored + " unscored" }),
          el("dt", { text:"Checklist total" }), el("dd", { text:p.checklist_total + " points across " + (p.checklist || []).length + " questions" })
        ]),
        el("div", { style:"margin-top:14px" }, [el("div", { class:"kv" }, [
          el("span", { class:"k", text:"Instructions sent to the model" }),
          el("div", { text:p.run.instructions || "—" })
        ])])
      ])
    ]);

    var scoring = el("div", { class:"panel" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"How the score is built" })]),
      el("div", { class:"list" }, (p.checklist || []).map(function (c) {
        return el("div", { class:"list-row" }, [
          el("div", { class:"list-label" }, [el("div", { class:"t", text:c.label }), el("div", { class:"d", text:c.description || "" })]),
          el("div", { class:"list-metric", text:c.points + " pts" }),
          el("div", { class:"list-metric", style:"color:var(--muted)", text:pct(c.passed, s.records || 1) + "%" })
        ]);
      }).concat([el("div", { class:"list-row", style:"background:var(--surface-2)" }, [
        el("div", { class:"list-label" }, [el("div", { class:"t", text:"Total available" })]),
        el("div", { class:"list-metric", text:p.checklist_total + " pts" }),
        el("div", { class:"list-metric", text:"" })
      ])]))
    ]);

    var claims = el("div", { class:"panel", style:"margin-top:18px" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Fields this task returns" })]),
      el("div", { class:"list" }, (p.claim_fields || []).map(function (f) {
        return el("div", { class:"list-row" }, [
          el("div", { class:"list-label" }, [el("div", { class:"t", text:f.label }), el("div", { class:"d", text:f.description || "" })]),
          el("div", { class:"list-metric", style:"width:auto;color:var(--muted)", text:f.type + (f.choices && f.choices.length ? " · " + f.choices.length + " choices" : "") })
        ]);
      }))
    ]);

    main.appendChild(el("div", { class:"cols" }, [info, scoring]));
    main.appendChild(claims);
  }

  /* ---------------- drawer ---------------- */
  var KIND_LABEL = {
    delivery_proof:"delivery proof", named_clients:"named clients", stack_delivery:"stack in delivery",
    independent_validation:"independent", delivery_hiring:"hiring", commercial_terms:"commercial",
    certification:"certification", engineering_output:"engineering", growth_signal:"growth",
    dated_events:"dated"
  };

  function evidenceChips(ev, limit) {
    var kinds = (ev && ev.kinds) || {};
    var present = Object.keys(kinds).filter(function (k) { return kinds[k]; });
    if (!present.length) return el("span", { class:"empty-value", text:"no evidence read" });
    return el("div", { class:"chips" }, present.slice(0, limit || 4).map(function (k) {
      return el("span", { class:"tag soft mini", text:KIND_LABEL[k] || k });
    }).concat(present.length > (limit || 4) ? [el("span", { class:"empty-value", text:"+" + (present.length - (limit || 4)) })] : []));
  }

  function tierCell(partner) {
    var ev = partner.evidence || {};
    var shown = ev.tier_capped && ev.tier_supported ? ev.tier_supported : partner.tier;
    var node = el("span", { class:tierTagClass(shown), text:TIER_LABEL[shown] || shown || "—" });
    if (!ev.tier_capped) return el("td", null, [node]);
    return el("td", null, [el("div", { style:"display:flex;align-items:center;gap:6px;flex-wrap:wrap" }, [
      node,
      el("span", {
        class:"tag mini", style:"border-color:var(--warn-line);color:var(--warn)",
        text:"evidence-capped",
        title:(ev.tier_reasons || []).join("; ") || "the evidence does not support the scored tier"
      })
    ])]);
  }

  function openDrawer(id) {
    var p = STATE.payload;
    var partner = (p.partners || []).filter(function (x) { return x.id === id; })[0];
    if (!partner) return;
    STATE.selected = id;
    var host = document.getElementById("drawerContent");
    clear(host);

    host.appendChild(el("div", { class:"drawer-head" }, [
      el("div", { style:"flex:1;min-width:0" }, [
        el("h3", { class:"drawer-title", text:partner.name || partner.id }),
        el("div", { style:"display:flex;align-items:center;gap:8px;flex-wrap:wrap" }, [
          el("span", { class:tierTagClass((partner.evidence || {}).tier_capped && (partner.evidence || {}).tier_supported ? partner.evidence.tier_supported : partner.tier), text:TIER_LABEL[(partner.evidence || {}).tier_capped && (partner.evidence || {}).tier_supported ? partner.evidence.tier_supported : partner.tier] || partner.tier || "unscored" }),
          ((partner.evidence || {}).tier_capped ? el("span", { class:"tag mini", style:"border-color:var(--warn-line);color:var(--warn)", text:"evidence-capped" }) : null),
          el("span", { class:"section-sub", text:partner.score === null ? "no score" : partner.score + " / " + p.checklist_total + " points" }),
          el("span", { class:"section-sub", text:(partner.quotes || []).length + " verified quote(s)" })
        ])
      ]),
      el("button", { class:"iconbtn", type:"button", "aria-label":"Close", text:"✕", onclick:closeDrawer })
    ]));

    var body = el("div", { class:"drawer-body" });

    body.appendChild(el("div", { class:"section" }, [
      el("div", { class:"section-head" }, [el("h4", { class:"section-title", style:"font-size:14px", text:"Score breakdown" })]),
      el("div", { class:"bar " + scoreClass(partner.tier), style:"height:8px" }, [el("span", { style:"width:" + (partner.score === null ? 0 : Math.max(2, pct(partner.score, p.checklist_total))) + "%" })]),
      el("div", { class:"section-sub", style:"margin-top:6px", text:partner.earned_points + " of " + p.checklist_total + " points earned" }),
      el("div", { class:"q-list", style:"margin-top:10px" }, (p.checklist || []).map(function (c) {
        var passed = !!(partner.checklist || {})[c.item_id];
        var why = (partner.quotes || []).filter(function (q) { return (q.supports || []).indexOf(c.item_id) !== -1; })[0];
        return el("div", { class:"q" }, [
          el("span", { class:"q-mark " + (passed ? "yes" : "no"), text:passed ? "✓" : "✕" }),
          el("div", { class:"q-text" }, [
            el("div", { class:"t", text:c.label }),
            el("div", { class:"d", text:c.description || "" }),
            why ? el("div", { class:"why", text:"“" + why.text + "”" }) : (passed ? null : el("div", { class:"why empty-value", text:"no evidence in the fetched sources" }))
          ]),
          el("span", { class:"q-pts " + (passed ? "earned" : ""), text:(passed ? "+" : "") + c.points })
        ]);
      }))
    ]));

    (function () {
      var ev = partner.evidence || {};
      if (!ev.kinds) return;
      var rows = [];
      if (ev.tier_capped) {
        rows.push(el("div", { class:"q" }, [
          el("span", { class:"q-mark no", text:"!" }),
          el("div", { class:"q-text" }, [
            el("div", { class:"t", text:"Scored " + (TIER_LABEL[ev.tier_claimed] || ev.tier_claimed) + ", evidence supports " + (TIER_LABEL[ev.tier_supported] || ev.tier_supported) }),
            el("div", { class:"d", text:(ev.tier_reasons || []).join("; ") })
          ])
        ]));
      }
      (ev.contradictions || []).forEach(function (finding) {
        rows.push(el("div", { class:"q" }, [
          el("span", { class:"q-mark no", text:"!" }),
          el("div", { class:"q-text" }, [
            el("div", { class:"t", text:finding.kind.replace(/_/g, " ") }),
            el("div", { class:"d", text:finding.claim + " — " + finding.counterpart }),
            (finding.uris || []).length ? el("div", { class:"why", text:(finding.uris || []).join(", ") }) : null
          ])
        ]));
      });
      body.appendChild(el("div", { class:"section" }, [
        el("div", { class:"section-head" }, [el("h4", { class:"section-title", style:"font-size:14px", text:"What the evidence carries" }),
          el("span", { class:"section-sub", text:"read from the sources themselves, not from the score" })]),
        el("div", { style:"margin-bottom:8px" }, [evidenceChips(ev, 12)]),
        el("div", { class:"chips", style:"margin-bottom:8px" }, (ev.confidences || []).map(function (f) {
          var weak = f.weight !== undefined && f.weight < 1;
          return el("span", {
            class:"tag soft mini",
            style: weak ? "border-color:var(--warn-line);color:var(--warn)" : "",
            title: (KIND_LABEL[f.kind] || f.kind) + " — " + (f.shown_as || f.confidence) + " (" + (f.category || "unlabelled") + ")",
            text: (KIND_LABEL[f.kind] || f.kind) + ": " + (f.confidence || "?")
          });
        })),
        el("div", { class:"q-list" }, rows.length ? rows : [el("div", { class:"section-sub", text:"No claim in this dossier stands alone." })])
      ]));
    })();

    body.appendChild(el("div", { class:"section" }, [
      el("div", { class:"section-head" }, [el("h4", { class:"section-title", style:"font-size:14px", text:"Attributes" }),
        el("span", { class:"section-sub", text:"exactly what the sources stated" })]),
      el("div", { class:"panel" }, [
        el("dl", { class:"attrs" }, Object.keys(partner.answers || {}).reduce(function (acc, key) {
          var spec = (p.attributes || []).filter(function (a) { return a.key === key; })[0] || { label:key };
          var value = partner.answers[key];
          acc.push(el("dt", { text:spec.label }));
          if (isEmptyValue(value)) acc.push(el("dd", null, [el("span", { class:"empty-value", text:"not stated in source" })]));
          else if (Array.isArray(value)) acc.push(el("dd", null, [el("div", { class:"chips" }, value.map(function (v) { return el("span", { class:"tag soft", text:String(v) }); }))]));
          else if (isPlainObject(value)) acc.push(el("dd", null, [el("div", { class:"kv" }, Object.keys(value).map(function (k) {
            return el("div", null, [el("span", { class:"k", text:k.replace(/_/g, " ") }), el("div", null, [dashText(value[k])])]);
          }))]));
          else acc.push(el("dd", null, [el("span", { text:String(value) })]));
          return acc;
        }, []))
      ])
    ]));

    body.appendChild(el("div", { class:"section" }, [
      el("div", { class:"section-head" }, [el("h4", { class:"section-title", style:"font-size:14px", text:"Why this score" })]),
      el("div", { class:"panel" }, [el("div", { class:"panel-body", text:partner.reasoning || "—" })])
    ]));

    body.appendChild(el("div", { class:"section" }, [
      el("div", { class:"section-head" }, [el("h4", { class:"section-title", style:"font-size:14px", text:"Evidence" })]),
      (partner.quotes || []).length ? el("div", null, partner.quotes.map(function (q) {
        return el("blockquote", { class:"quote" }, [
          el("p", { text:"“" + q.text + "”" }),
          el("div", { class:"quote-meta" }, [
            el("span", { class:"mono", text:"chars " + q.start + "–" + q.end }),
            el("span", { class:"chips" }, (q.supports || []).map(function (s) {
              var item = (p.checklist || []).filter(function (c) { return c.item_id === s; })[0];
              return el("span", { class:"tag soft mini", text:item ? item.label : s });
            }))
          ])
        ]);
      })) : el("div", { class:"panel" }, [el("div", { class:"state", text:"No verified quotes for this " + recordNoun().one.toLowerCase() + "." })])
    ]));

    var src = partner.source || {}, prov = partner.provenance || {};
    body.appendChild(el("div", { class:"section" }, [
      el("div", { class:"section-head" }, [el("h4", { class:"section-title", style:"font-size:14px", text:"Source & provenance" })]),
      el("div", { class:"panel" }, [
        el("dl", { class:"attrs" }, [
          el("dt", { text:"Source URL" }),
          el("dd", null, [src.uri ? el("a", { href:src.uri, target:"_blank", rel:"noopener noreferrer", text:src.uri }) : el("span", { class:"empty-value", text:"input CSV had no source_uri column" })]),
          el("dt", { text:"Scored at" }), el("dd", { text:shortTime(src.scored_at) }),
          el("dt", { text:"Route" }), el("dd", null, [el("span", { class:"mono", text:prov.route || "—" }), " ", el("span", { class:"tag soft mini", text:prov.cost_status || "cost unknown" })]),
          el("dt", { text:"Reported cost" }), el("dd", { text:"$" + Number(prov.cost || 0).toFixed(6) + (prov.duration_seconds ? " · " + Number(prov.duration_seconds).toFixed(1) + "s" : "") }),
          el("dt", { text:"Verification" }), el("dd", null, [
            el("span", { class:"tag " + (prov.status === "verified" ? "tier_1" : "unfit"), text:prov.status || "unknown" }), " ",
            el("span", { class:"section-sub", text:(prov.attempts || 1) + " attempt(s)" })
          ])
        ]),
        el("div", { style:"padding:0 0 4px" }, [el("details", { class:"raw" }, [
          el("summary", { text:"Raw claims payload" }),
          el("pre", { text:JSON.stringify(partner.claims || {}, null, 2) })
        ])])
      ])
    ]));

    host.appendChild(body);
    host.appendChild(el("div", { class:"drawer-foot", text:"Read-only view · close with Esc" }));
    document.getElementById("drawer").classList.add("open");
    document.getElementById("drawer").setAttribute("aria-hidden", "false");
    document.getElementById("backdrop").classList.add("open");
    renderTable();
  }
  function closeDrawer() {
    STATE.selected = null;
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("drawer").setAttribute("aria-hidden", "true");
    document.getElementById("backdrop").classList.remove("open");
    renderTable();
  }

  /* ---------------- render ---------------- */
  function render() {
    var main = document.getElementById("main");
    clear(main);
    renderNav();
    renderFilters();
    if (!STATE.payload) { main.appendChild(el("div", { class:"state", text:"Loading run…" })); return; }
    renderHeader();
    if (STATE.view === "partners") renderPartners();
    else if (STATE.view === "pipeline") renderPipeline();
    else if (STATE.view === "scorecard") renderScorecard();
    else if (STATE.view === "evidence") renderEvidence();
    else if (STATE.view === "list") renderRunningList();
    else renderRun();
  }

  /* Every firm the fleet has looked at, across every run: the ladder's verdict,
     the score the last scoring node gave it, and what is still open. The run
     detail above answers "what happened"; this answers "who do we know". */
  function renderRunningList() {
    var main = document.getElementById("main"), ledger = STATE.payload.ledger || {};
    var rows = ledger.entities || [], counts = ledger.counts || {};
    var movers = ledger.movers || [];
    var section = el("section", { class:"section" }, [
      el("div", { class:"section-head" }, [
        el("h2", { class:"section-title", text:"Running list" }),
        el("span", { class:"section-sub", text:(counts.entities || 0) + " firm(s) remembered across runs · newest score first" })
      ])
    ]);
    if (movers.length) {
      section.appendChild(el("div", { class:"toolbar" }, [
        el("span", { class:"section-sub", text:"Moved: " + movers.map(function (m) {
          return m.entity + " " + (m.delta > 0 ? "+" : "") + m.delta.toFixed(1);
        }).join(" · ") })
      ]));
    }
    if (!rows.length) {
      section.appendChild(el("div", { class:"state", text:"Nothing on the list yet — no node has recorded an entity." }));
      main.appendChild(section);
      return;
    }
    var head = el("tr", null, [
      el("th", { text:"Firm" }), el("th", { text:"Outcome" }), el("th", { text:"Score" }),
      el("th", { text:"Tier" }), el("th", { text:"Last seen" }), el("th", { text:"Still open" }),
      el("th", { text:"Visits" })
    ]);
    var body = el("tbody");
    rows.forEach(function (row) {
      var open = (row.gates_open || []).join(", ") || "—";
      body.appendChild(el("tr", null, [
        el("td", { text: row.entity }),
        el("td", { text: row.standing || row.outcome || "unjudged" }),
        el("td", { class:"score-num", text: row.score ? Number(row.score).toFixed(1) : "—" }),
        el("td", { text: row.tier || "—" }),
        el("td", { text: String(row.last_seen || "").slice(0, 10) }),
        el("td", { text: open }),
        el("td", { text: String(row.sightings || 0) })
      ]));
    });
    section.appendChild(el("div", { class:"table-wrap" }, [
      el("table", null, [el("thead", null, [head]), body])
    ]));
    main.appendChild(section);
  }

  function renderRunPicker() {
    var sel = document.getElementById("runSelect");
    clear(sel);
    STATE.runs.forEach(function (r) {
      sel.appendChild(el("option", { value:r.run_id, selected:r.run_id === STATE.payload.run.run_id },
        [r.run_id + " · " + r.status + " · " + r.total_items + " item" + (r.total_items === 1 ? "" : "s")]));
    });
    sel.onchange = function () { loadRun(sel.value); };
  }

  function setStatus(status) {
    var pill = document.getElementById("statusPill");
    pill.className = "pill " + (status === "completed" ? "ok" : (status === "running" ? "warn" : "bad"));
    document.getElementById("statusText").textContent = status || "unknown";
  }

  function loadRun(runId) {
    var url = "/api/board" + (runId ? "?run=" + encodeURIComponent(runId) : "");
    fetch(url).then(function (r) {
      return r.json().then(function (body) { return { ok:r.ok, body:body }; });
    }).then(function (res) {
      var main = document.getElementById("main");
      if (!res.ok) {
        clear(main);
        main.appendChild(el("div", { class:"state" }, [
          el("strong", { text:"This run could not be loaded" }),
          el("span", { text:(res.body && res.body.error) ? res.body.error : "unknown error" })
        ]));
        return;
      }
      STATE.payload = res.body;
      STATE.selected = null;
      var p = STATE.payload;
      var boardTitle = (p.run.lane ? p.run.lane + " lane" : (p.run.task ? p.run.task : "Results")) + " board";
      document.title = boardTitle + " · " + p.run.run_id;
      var brandTitle = document.getElementById("brandTitle");
      if (brandTitle) brandTitle.textContent = boardTitle;
      document.getElementById("runSub").textContent = (p.run.lane ? p.run.lane + " · " : "") + (p.run.task || "run") + " · " + p.stats.records + " record(s) · " + shortTime(p.run.created_at);
      setStatus(p.run.status);
      if (history.replaceState) history.replaceState(null, "", "?run=" + encodeURIComponent(p.run.run_id));
      renderRunPicker();
      render();
    }).catch(function (err) {
      var main = document.getElementById("main");
      clear(main);
      main.appendChild(el("div", { class:"state" }, [el("strong", { text:"Board API unreachable" }), el("span", { text:String(err) })]));
    });
  }

  document.getElementById("backdrop").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
  document.getElementById("clearFilters").addEventListener("click", function () {
    STATE.tiers.clear();
    STATE.facets = {};
    STATE.query = "";
    render();
  });

  var initial = new URLSearchParams(location.search).get("run");
  fetch("/api/runs").then(function (r) { return r.json(); }).then(function (body) {
    STATE.runs = body.runs || [];
    if (!initial && body.current) initial = body.current;
    loadRun(initial);
  }).catch(function () { loadRun(initial); });
})();
</script>
</body>
