<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results board</title>
<style>
  :root {
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc; --surface-3:#f2f4f7;
    --border:#e4e7ec; --border-strong:#d0d5dd;
    --text:#101828; --text-2:#475467; --muted:#98a2b3;
    --accent:#444ce7; --accent-soft:#eef2ff; --accent-line:#c7d2fe;
    --ok:#067647; --ok-soft:#ecfdf3; --ok-line:#abefc6;
    --info:#175cd3; --info-soft:#eff8ff; --info-line:#b2ddff;
    --warn:#b54708; --warn-soft:#fffaeb; --warn-line:#fedf89;
    --bad:#b42318; --bad-soft:#fef3f2; --bad-line:#fecdca;
    --radius:10px; --radius-sm:7px;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --shadow-lg:0 12px 32px rgba(16,24,40,.12);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  /* Lane colours are not stylesheet rules. A lane declares its accent and the
     page applies it from the payload, so a lane this page has never heard of
     still gets its own look; the defaults above are what an undeclared one keeps. */
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* ---------- shell ---------- */
  .topbar { position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--border); }
  .topbar-inner { max-width:1560px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:20px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark { width:28px; height:28px; border-radius:8px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; }
  .brand-text { min-width:0; }
  .brand-title { font-size:15px; font-weight:650; letter-spacing:-.01em; }
  .brand-sub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spacer { flex:1; }
  .run-picker { display:flex; align-items:center; gap:8px; }
  select, input[type=search], input[type=text] {
    font:inherit; color:var(--text); background:var(--surface);
    border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:7px 10px; min-width:0;
  }
  select:focus, input:focus { outline:2px solid var(--accent-line); outline-offset:1px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface-3); color:var(--text-2); }
  .pill .dot { width:6px; height:6px; border-radius:50%; background:var(--muted); }
  .pill.ok { background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok); }
  .pill.ok .dot { background:var(--ok); }
  .pill.warn { background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn); }
  .pill.warn .dot { background:var(--warn); }
  .pill.bad { background:var(--bad-soft); border-color:var(--bad-line); color:var(--bad); }
  .pill.bad .dot { background:var(--bad); }

  .layout { max-width:1560px; margin:0 auto; padding:22px 24px 80px; display:grid; grid-template-columns:236px minmax(0,1fr); gap:22px; align-items:start; }

  /* ---------- sidebar ---------- */
  .sidebar { position:sticky; top:76px; display:flex; flex-direction:column; gap:16px; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button { display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:transparent; border:0; border-radius:var(--radius-sm); padding:8px 10px; font-size:13.5px; font-weight:550; color:var(--text-2); }
  .nav button:hover { background:var(--surface-3); color:var(--text); }
  .nav button[aria-selected=true] { background:var(--accent-soft); color:var(--accent); }
  .nav .count { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
  .nav button[aria-selected=true] .count { color:var(--accent); }

  .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .panel-head { padding:11px 13px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .panel-title { font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .panel-body { padding:13px; }

  .field { margin-bottom:11px; }
  .field:last-child { margin-bottom:0; }
  .field-label { font-size:11px; font-weight:650; color:var(--text-2); margin-bottom:5px; letter-spacing:.02em; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface); font-size:12px; font-weight:550; color:var(--text-2); }
  .chip .n { color:var(--muted); font-variant-numeric:tabular-nums; font-size:11px; }
  .tag-soft { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border); font-size:12px; color:var(--text-2); }
  .callout { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .callout .tag-soft { font-size:11.5px; padding:2px 7px; }
  .chip[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip[aria-pressed=true] .n { color:rgba(255,255,255,.75); }
  .linkbtn { background:none; border:0; padding:0; color:var(--accent); font-size:12px; font-weight:600; }

  /* ---------- stats ---------- */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:12px; margin-bottom:18px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow); }
  .stat .k { font-size:11px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .stat .v { font-size:24px; font-weight:660; letter-spacing:-.02em; margin-top:4px; font-variant-numeric:tabular-nums; }
  .stat .s { font-size:12px; color:var(--muted); margin-top:2px; }

  /* ---------- section ---------- */
  .section { margin-bottom:18px; }
  .section-head { display:flex; align-items:flex-end; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .section-title { font-size:18px; font-weight:650; letter-spacing:-.015em; margin:0; }
  .section-sub { font-size:12.5px; color:var(--muted); }
  .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar input[type=search] { min-width:220px; }

  /* ---------- table ---------- */
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:auto; max-height:calc(100vh - 300px); }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
  thead th { position:sticky; top:0; z-index:2; background:var(--surface-2); text-align:left; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.sortable { cursor:pointer; user-select:none; }
  thead th.sortable:hover { color:var(--text-2); }
  thead th .arrow { opacity:.45; font-size:10px; }
  tbody td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr.row { cursor:pointer; }
  tbody tr.row:hover { background:var(--surface-2); }
  tbody tr.row[aria-selected=true] { background:var(--accent-soft); }
  .sticky-col { position:sticky; left:0; background:var(--surface); z-index:1; border-right:1px solid var(--border); min-width:190px; }
  tbody tr.row:hover .sticky-col { background:var(--surface-2); }
  tbody tr.row[aria-selected=true] .sticky-col { background:var(--accent-soft); }
  .cell-name { font-weight:600; letter-spacing:-.01em; }
  /* A name that opens the dossier is a button, so it is reachable and operable by
     keyboard like anything else. It keeps no chrome until it is hovered or focused. */
  button.cell-name { background:none; border:0; padding:0; font:inherit; font-weight:600; letter-spacing:-.01em; color:inherit; text-align:left; cursor:pointer; }
  button.cell-name:hover { text-decoration:underline; }
  button.cell-name:focus-visible { outline:2px solid var(--accent-line); outline-offset:2px; border-radius:3px; }
  thead th .th-sort { background:none; border:0; padding:0; font:inherit; font-weight:650; color:inherit; letter-spacing:.02em; cursor:pointer; }
  thead th .th-sort:focus-visible { outline:2px solid var(--accent-line); outline-offset:2px; border-radius:3px; }
  .cell-sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .cell-text { max-width:280px; color:var(--text-2); }
  .num { font-variant-numeric:tabular-nums; }
  .empty-value { color:var(--muted); font-style:italic; font-size:12.5px; }
  .score-cell { display:flex; flex-direction:column; gap:4px; min-width:74px; }
  .score-num { font-weight:660; font-variant-numeric:tabular-nums; }
  .bar { height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); }
  .bar.ok > span { background:var(--ok); }
  .bar.info > span { background:var(--info); }
  .bar.warn > span { background:var(--warn); }
  .bar.bad > span { background:var(--bad); }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:650; border:1px solid var(--border); background:var(--surface-3); color:var(--text-2); white-space:nowrap; }
  .tag.tier_1 { background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok); }
  .tag.tier_2 { background:var(--info-soft); border-color:var(--info-line); color:var(--info); }
  .tag.tier_3 { background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn); }
  .tag.unfit { background:var(--bad-soft); border-color:var(--bad-line); color:var(--bad); }
  .tag.soft { background:var(--surface-3); color:var(--text-2); font-weight:550; }
  .tag.mini { font-size:11px; padding:1px 7px; }
  .tag.tag-comp { background:#ecfdf3; color:#067647; border-color:#abefc6; font-weight:600; }
  .tag.tag-geo { background:#eff8ff; color:#175cd3; border-color:#b2ddff; }
  .tag.tag-tech { background:#f5f3ff; color:#6938ef; border-color:#d9d6fe; font-weight:600; }
  .tag.tag-motion { background:#f0fdf9; color:#0f766e; border-color:#99f6e4; font-weight:600; }

  .score-pill {
    display:inline-flex; align-items:center; justify-content:center;
    padding:1.5px 7px; border-radius:6px; font-weight:700; font-size:12px;
    font-variant-numeric:tabular-nums; border:1px solid var(--border);
    background:var(--surface-3); color:var(--text-2); min-width:32px;
  }
  .score-pill.tier_1 { background:var(--ok-soft); color:var(--ok); border-color:var(--ok-line); }
  .score-pill.tier_2 { background:var(--info-soft); color:var(--info); border-color:var(--info-line); }
  .score-pill.tier_3 { background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line); }
  .score-pill.unfit { background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line); }

  .card-action-btn {
    display:inline-flex; align-items:center; gap:4px; padding:2px 8px;
    border-radius:5px; font-size:11px; font-weight:600; border:1px solid var(--accent-line);
    background:var(--accent-soft); color:var(--accent); text-decoration:none;
    margin-left:auto; transition:all .15s ease;
  }
  .card-action-btn:hover {
    background:var(--accent); color:#fff; border-color:var(--accent); text-decoration:none;
  }

  .verdict-box {
    padding:13px 15px; border-radius:var(--radius-sm); border:1px solid var(--border);
    border-left:4px solid var(--accent); background:var(--accent-soft);
  }
  .verdict-head {
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:var(--accent); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between;
  }
  .verdict-copy-btn {
    background:none; border:1px solid var(--accent-line); border-radius:4px; padding:2px 7px;
    font-size:11px; color:var(--accent); cursor:pointer; font-weight:600;
  }
  .verdict-copy-btn:hover {
    background:var(--accent); color:#fff;
  }
  .verdict-text {
    font-size:13.5px; line-height:1.55; color:var(--text); font-weight:500;
  }

  /* ---------- cards / grid ---------- */
  .cols { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:18px; align-items:start; }
  @media (max-width:980px) { .cols { grid-template-columns:minmax(0, 1fr); } }
  .list { display:flex; flex-direction:column; }
  .list-row { display:flex; align-items:center; gap:12px; padding:10px 13px; border-bottom:1px solid var(--border); }
  .list-row:last-child { border-bottom:0; }
  .list-label { flex:1; min-width:0; }
  .list-label .t { font-size:13px; font-weight:600; }
  .list-label .d { font-size:12px; color:var(--muted); margin-top:1px; }
  .list-metric { width:64px; text-align:right; font-size:13px; font-weight:650; font-variant-numeric:tabular-nums; }
  .list-bar { width:120px; }
  @media (max-width:620px) { .list-bar { display:none; } }

  .stack { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--surface-3); }
  .stack > div { height:100%; }
  .legend { display:flex; flex-direction:column; margin-top:12px; }
  .legend-row { display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .legend-row:last-child { border-bottom:0; }
  .swatch { width:10px; height:10px; border-radius:3px; flex:none; }
  .legend-row .n { margin-left:auto; font-weight:650; font-variant-numeric:tabular-nums; }
  .legend-row .r { color:var(--muted); font-size:12px; min-width:74px; text-align:right; }

  dl.attrs { margin:0; display:grid; grid-template-columns:minmax(120px,190px) minmax(0,1fr); }
  dl.attrs dt { padding:9px 12px 9px 0; font-size:12.5px; font-weight:600; color:var(--text-2); border-bottom:1px solid var(--border); }
  dl.attrs dd { margin:0; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; min-width:0; }
  dl.attrs dt:last-of-type, dl.attrs dd:last-of-type { border-bottom:0; }
  .kv { display:flex; flex-direction:column; gap:2px; }
  .kv .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; font-weight:650; }

  blockquote.quote { margin:0 0 10px; padding:11px 13px; background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--accent-line); border-radius:var(--radius-sm); }
  blockquote.quote:last-child { margin-bottom:0; }
  blockquote.quote p { margin:0 0 8px; font-size:13px; }
  .quote-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
  .quote-meta code, .mono { font-family:var(--mono); font-size:11.5px; color:var(--text-2); }

  /* ---------- kanban ---------- */
  .kanban { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; align-items:start; }
  @media (max-width:1080px) { .kanban { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:680px) { .kanban { grid-template-columns:1fr; } }
  .kanban-col {
    background:var(--surface-2); border:1px solid var(--border);
    border-top:3.5px solid var(--border-strong); border-radius:var(--radius);
    padding:11px; min-height:120px; transition:border-color .15s ease;
  }
  .kanban-col[data-tier="tier_1"] { border-top-color:var(--ok); }
  .kanban-col[data-tier="tier_2"] { border-top-color:var(--info); }
  .kanban-col[data-tier="tier_3"] { border-top-color:var(--warn); }
  .kanban-col[data-tier="unfit"] { border-top-color:var(--bad); }
  .kanban-head { display:flex; align-items:center; gap:8px; padding:2px 2px 10px; border-bottom:1px solid var(--border); margin-bottom:10px; }
  .lane-count { font-size:12px; font-weight:650; color:var(--text-2); background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:1px 8px; font-variant-numeric:tabular-nums; }
  .kanban-empty { font-size:12.5px; color:var(--muted); font-style:italic; padding:10px 4px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 11px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow); transition:border-color .15s ease, box-shadow .15s ease; }
  .card:last-child { margin-bottom:0; }
  .card:hover { border-color:var(--border-strong); box-shadow:0 2px 6px rgba(16,24,40,.08); }
  .card[aria-selected=true] { border-color:var(--accent); background:var(--accent-soft); }
  .card-top { display:flex; align-items:center; gap:8px; }
  .card-top .score-num { margin-left:auto; font-size:15px; }
  .card-practice { font-size:12.5px; color:var(--text-2); margin-top:5px; line-height:1.4; }
  .card-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }

  /* ---------- drawer ---------- */
  /* A modal <dialog> owns the parts of a drawer that are easy to get wrong: it
     traps focus, restores it on close, closes on Esc, and sits in the top layer.
     The page styles the surface and the backdrop and implements none of that. */
  .drawer { position:fixed; inset:0 0 0 auto; margin:0; padding:0; width:min(660px,94vw); max-width:100%; height:100vh; height:100dvh; max-height:100%; background:var(--surface); color:var(--text); border:0; border-left:1px solid var(--border); box-shadow:var(--shadow-lg); display:flex; flex-direction:column; overscroll-behavior:contain; }
  .drawer:not([open]) { display:none; }
  .drawer::backdrop { background:rgba(16,24,40,.28); }
  .drawer-head { padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:14px; }
  .drawer-title { font-size:17px; font-weight:660; letter-spacing:-.015em; margin:0 0 4px; }
  .iconbtn { border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); width:30px; height:30px; display:grid; place-items:center; color:var(--text-2); flex:none; }
  .iconbtn:hover { background:var(--surface-3); }
  .drawer-body { overflow:auto; padding:16px 18px 40px; }
  .drawer-foot { border-top:1px solid var(--border); padding:10px 18px; font-size:12px; color:var(--muted); background:var(--surface-2); }
  .q-list { display:flex; flex-direction:column; }
  .q { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); align-items:start; }
  .q:last-child { border-bottom:0; }
  .q-mark { width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; margin-top:1px; }
  .q-mark.yes { background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok-line); }
  .q-mark.no { background:var(--surface-3); color:var(--muted); border:1px solid var(--border); }
  .q-text { min-width:0; }
  .q-text .t { font-size:13px; font-weight:600; }
  .q-text .d { font-size:12px; color:var(--muted); margin-top:1px; }
  .q-text .why { font-size:12px; color:var(--text-2); margin-top:4px; padding-left:9px; border-left:2px solid var(--border); }
  .q-pts { font-size:12px; font-weight:650; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .q-pts.earned { color:var(--ok); }

  .state { padding:36px 20px; text-align:center; color:var(--muted); font-size:13.5px; }
  .state strong { display:block; color:var(--text-2); font-size:15px; margin-bottom:4px; }
  .nowrap { white-space:nowrap; }
  details.raw { margin-top:10px; }
  details.raw summary { cursor:pointer; font-size:12px; color:var(--text-2); font-weight:600; }
  details.raw pre { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; overflow:auto; font-family:var(--mono); font-size:11.5px; margin:8px 0 0; }
  /* Narrow (or zoomed) viewport: the sidebar's column becomes a wrapped row of
     chips, and the grid's minimum comes from the scroll container rather than
     from the fifteen-column table inside it. Placed last, after the base rules
     it overrides — the first version of this sat above them and lost. */
  @media (max-width:1080px) {
    .layout { grid-template-columns:minmax(0, 1fr); }
    .sidebar { position:static; }
    .nav { flex-direction:row; flex-wrap:wrap; }
    .nav button { width:auto; }
    .nav button .count { margin-left:6px; }
  }
</style>

    if (v === null || v === undefined || v === "") return "—";
    if (Array.isArray(v)) return v.join(" · ");
    if (isPlainObject(v)) {
      // Nested objects show only the parts the source actually stated.
      var parts = Object.keys(v)
        .filter(function (k) { return !isEmptyValue(v[k]); })
        .map(function (k) { return k.replace(/_/g, " ") + ": " + fmtValue(v[k]); });
      return parts.length ? parts.join(" · ") : "—";
    }
    if (typeof v === "boolean") return v ? "yes" : "no";
    return String(v);
  }
  function dashText(v) {
    return isEmptyValue(v) ? el("span", { class:"empty-value", text:"not stated in source" }) : el("span", { text:fmtValue(v) });
  }
  function shortTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  /* ---------------- filters ---------------- */
  /* The filtering already happened: the profile and the lane's gates ran before
     the search, and a row here is what survived them. So the only thing worth
     offering is *finding* a row — and the interesting attributes are called out
     on the row itself rather than turned into a second place to filter. */
  function partnerMatches(p) {
    var q = STATE.query.trim().toLowerCase();
    if (!q) return true;
    var hay = [
      p.id, p.name, p.practice, p.reasoning, p.tier, p.tier_supported,
      (p.highlights || []).join(" "), JSON.stringify(p.answers || {}),
    ].join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  }
  function visiblePartners() { return (STATE.payload.partners || []).filter(partnerMatches); }
  function activeFilterCount() { return STATE.query.trim() ? 1 : 0; }
  function toggleSet(set, value) { if (set.has(value)) set.delete(value); else set.add(value); }

  /* ---------------- views ---------------- */
  var VIEWS = [
    { id:"partners", label:"Records" },
    { id:"pipeline", label:"Pipeline" },
    { id:"scorecard", label:"Scorecard" },
    { id:"evidence", label:"Evidence" },
    { id:"run", label:"Run detail" },
    { id:"list", label:"Running list" }
  ];

  function renderNav() {
    var nav = document.getElementById("nav"), p = STATE.payload;
    clear(nav);
    if (!p) return;
    var counts = {
      partners: visiblePartners().length + "/" + (p.partners || []).length,
      pipeline: Object.keys(p.stats.tier_counts).length + " stages",
      scorecard: (p.checklist || []).length + " q",
      evidence: String(p.stats.quote_count),
      run: p.stats.batches_verified + "/" + p.stats.batches_total,
      list: String(((p.ledger || {}).counts || {}).entities || 0)
    };
    VIEWS.forEach(function (v) {
      var label = v.id === "partners" ? recordNoun().many : v.label;
      nav.appendChild(el("button", {
        type:"button", role:"tab", "aria-selected": STATE.view === v.id,
        onclick: function () { STATE.view = v.id; render(); }
      }, [el("span", { text:label }), el("span", { class:"count", text:counts[v.id] })]));
    });
  }

  /* What this run's rows actually differ on. The filtering is the profile's job
     and it already ran; this says which attributes came back with more than one
     value, so a reader knows what the rows are telling them apart by. */
  function renderHighlights() {
    var host = document.getElementById("highlightBody"), p = STATE.payload;
    if (!host) return;
    clear(host);
    if (!p) return;
    var facets = p.facets || {};
    var interesting = (p.attributes || []).filter(function (a) {
      return Object.keys(facets[a.key] || {}).length > 1;
    });
    if (!interesting.length) {
      host.appendChild(el("div", { class:"empty-value", text:"No attribute has more than one value in this run yet." }));
      return;
    }
    interesting.slice(0, 8).forEach(function (a) {
      var facet = facets[a.key] || {};
      var values = Object.keys(facet).sort(function (x, y) { return facet[y] - facet[x]; });
      host.appendChild(el("div", { class:"field" }, [
        el("div", { class:"field-label", text:a.label }),
        el("div", { class:"chips" }, values.slice(0, 6).map(function (value) {
          return el("span", { class:"tag-soft", title:value,
                              text:(value.length > 26 ? value.slice(0, 25) + "…" : value)
                                   + (facet[value] > 1 ? " " + facet[value] : "") });
        }))
      ]));
    });
  }

  function statCard(k, v, sub) {
    return el("div", { class:"stat" }, [
      el("div", { class:"k", text:k }),
      el("div", { class:"v", text:v }),
      sub ? el("div", { class:"s", text:sub }) : null
    ]);
  }

  function renderHeader() {
    var p = STATE.payload, s = p.stats;
    document.getElementById("main").appendChild(el("div", { class:"stats" }, [
      statCard(recordNoun().many, String(s.records), s.scored + " scored · " + s.unscored + " unscored"),
      statCard("Average score", s.average_score === null ? "—" : String(s.average_score), "best " + (s.best_score === null ? "—" : s.best_score) + " / " + p.checklist_total),
      statCard("Tier 1 / 2", (s.tier_counts.tier_1 || 0) + " / " + (s.tier_counts.tier_2 || 0), (s.tier_counts.tier_3 || 0) + " tier 3 · " + (s.tier_counts.unfit || 0) + " unfit"),
      statCard("Evidence-capped tiers", String(s.tier_capped || 0), (s.lone_claims || 0) + " claim(s) stand alone"),
      statCard("Verified quotes", String(s.quote_count), s.records_with_quotes + " of " + s.records + " " + recordNoun().many.toLowerCase() + " cited"),
      statCard("Route cost", "$" + Number(s.cost_reported || 0).toFixed(6), (s.routes || []).length + " price-verified route(s)"),
      statCard("Batches", s.batches_verified + "/" + s.batches_total, s.batches_failed ? s.batches_failed + " failed" : "all quotes verified")
    ]));
  }

  /* ---------------- records table ---------------- */
  function sortValue(partner, key) {
    if (key === "score") return partner.score;
    if (key === "id") return partner.id;
    if (key === "practice") return partner.practice;
    return (partner.answers || {})[key];
  }
  function sortPartners(rows) {
    var key = STATE.sort.key, dir = STATE.sort.dir;
    return rows.slice().sort(function (a, b) {
      var av = sortValue(a, key), bv = sortValue(b, key);
      var an = typeof av === "number" ? av : (isEmptyValue(av) ? -Infinity : String(av).toLowerCase());
      var bn = typeof bv === "number" ? bv : (isEmptyValue(bv) ? -Infinity : String(bv).toLowerCase());
      if (an < bn) return -1 * dir;
      if (an > bn) return 1 * dir;
      return String(a.id).localeCompare(String(b.id));
    });
  }

  function headerCell(label, key, extraClass) {
    var sorted = STATE.sort.key === key;
    return el("th", {
      class:"sortable " + (extraClass || ""), scope:"col",
      "aria-sort": sorted ? (STATE.sort.dir === 1 ? "ascending" : "descending") : "none"
    }, [el("button", {
      type:"button", class:"th-sort",
      onclick: function () {
        if (STATE.sort.key === key) STATE.sort.dir = -STATE.sort.dir;
        else { STATE.sort.key = key; STATE.sort.dir = key === "score" ? -1 : 1; }
        renderTable();
      }
    }, [label + " ", el("span", { class:"arrow", "aria-hidden":"true", text: sorted ? (STATE.sort.dir === 1 ? "▲" : "▼") : "↕" })])]);
  }

  function renderPartners() {
    var p = STATE.payload, main = document.getElementById("main");
    var rn = recordNoun();
    var searchTerms = rn.primary.toLowerCase() === rn.one.toLowerCase()
      ? [rn.one.toLowerCase(), rn.detail.toLowerCase()]
      : [rn.primary.toLowerCase(), rn.one.toLowerCase()];
    var search = el("input", { type:"search", placeholder:"Search " + searchTerms.join(", ") + ", evidence…", value:STATE.query, "aria-label":"Search rows" });
    search.addEventListener("input", function () {
      STATE.query = search.value;
      renderNav();
      renderTable();
    });
    main.appendChild(el("section", { class:"section" }, [
      el("div", { class:"section-head" }, [
        el("h2", { class:"section-title", text:"Ranked " + recordNoun().many.toLowerCase() }),
        el("span", { class:"section-sub", text:"ranked by score · click a row for the full dossier" })
      ]),
      el("div", { class:"toolbar" }, [
        search,
        el("span", { class:"section-sub", id:"rowCount", text:"" }),
        el("span", { class:"spacer" }),
        el("span", { class:"section-sub", text:"every column is a field this task asked for" })
      ]),
      el("div", { id:"tableHost" })
    ]));
    renderTable();
  }

  function renderTable() {
    var p = STATE.payload, host = document.getElementById("tableHost");
    if (!host) return;
    clear(host);
    var rows = sortPartners(visiblePartners());
    var countNode = document.getElementById("rowCount");
    if (countNode) countNode.textContent = rows.length + " of " + (p.partners || []).length + " " + recordNoun().many.toLowerCase();

    if (!rows.length) {
      host.appendChild(el("div", { class:"table-wrap" }, [
        el("div", { class:"state" }, [
          el("strong", { text:"No " + recordNoun().one.toLowerCase() + " matches that search" }),
          el("span", { text:"Clear the search to see the rest of the run." })
        ])
      ]));
      return;
    }

    // Most-consulted columns first; the long attribute tail scrolls horizontally.
    /* A lane judged by its own fields — career's rows are requisitions — has no
       checklist, so no score and no tier. Two columns of dashes are the board
       reporting the shape of a lane it is not looking at. */
    var scored = (p.checklist_total || 0) > 0 && (p.partners || []).some(function (x) { return x.score !== null; });
    var primaryNoun = (recordNoun().primary || recordNoun().one).toLowerCase();
    var detailNoun = recordNoun().detail.toLowerCase();
    // Exclude attributes that duplicate the primary entity name column or detail column
    var visibleAttributes = (p.attributes || []).filter(function (a) {
      var k = (a.key || "").toLowerCase();
      var l = (a.label || "").toLowerCase();
      return k !== primaryNoun && l !== primaryNoun && k !== detailNoun && l !== detailNoun;
    });

    var head = el("tr", null, [
      headerCell(recordNoun().primary || recordNoun().one, "id", "sticky-col"),
    ].concat(scored ? [headerCell("Score", "score"), el("th", { scope:"col", text:"Tier" })] : [])
     .concat([headerCell(recordNoun().detail, "practice")]));
    visibleAttributes.forEach(function (a) { head.appendChild(headerCell(a.label, a.key)); });
    head.appendChild(el("th", { scope:"col", text:"Evidence" }));

    var body = el("tbody");
    rows.forEach(function (partner) {
      var cells = [
        el("td", { class:"sticky-col" }, [
          el("button", { type:"button", class:"cell-name", text: partner.name || partner.id,
                         onclick: function (e) { e.stopPropagation(); openDrawer(partner.id); } }),
          el("div", { class:"cell-sub", text: (partner.quotes || []).length + " quote(s) · " + ((partner.provenance || {}).route || "no route") }),
          (partner.highlights || []).length
            ? el("div", { class:"callout" }, partner.highlights.map(function (text) {
                var tagClass = "tag soft mini";
                if (text.indexOf("comp:") === 0) tagClass = "tag tag-comp mini";
                else if (text.indexOf("territory:") === 0) tagClass = "tag tag-geo mini";
                else if (text.indexOf("stack:") === 0 || text.indexOf("alliances:") === 0) tagClass = "tag tag-tech mini";
                else if (text.indexOf("motion:") === 0) tagClass = "tag tag-motion mini";
                return el("span", { class:tagClass, text:text, title:text });
              }))
            : null
        ]),
        el("td", null, [el("div", { class:"cell-text", text:partner.detail || partner.practice || "" })])
      ];
      if (scored) {
        var ev = partner.evidence || {};
        var effectiveTier = ev.tier_capped && ev.tier_supported ? ev.tier_supported : partner.tier;
        cells.splice(1, 0, el("td", null, [
          el("div", { class:"score-cell" }, [
            el("div", { style:"display:flex;align-items:center;gap:6px" }, [
              el("span", { class:"score-pill " + (effectiveTier || "none"), text: partner.score === null ? "—" : partner.score }),
              el("span", { class:"cell-sub", text:"/ " + p.checklist_total })
            ]),
            el("span", { class:"bar " + scoreClass(partner.tier), style:"width:74px" }, [
              el("span", { style:"width:" + (partner.score === null ? 0 : Math.max(2, pct(partner.score, p.checklist_total))) + "%" })
            ])
          ])
        ]), tierCell(partner));
      }
      visibleAttributes.forEach(function (a) {
        var value = (partner.answers || {})[a.key];
        // Nothing to show is nothing shown: a dash is the page talking about
        // its own gaps when the reader asked about the firm.
        if (isEmptyValue(value)) cells.push(el("td", null, []));
        else if (Array.isArray(value)) {
          cells.push(el("td", null, [el("div", { class:"chips" },
            value.slice(0, 3).map(function (v) { return el("span", { class:"tag soft mini", text:String(v).slice(0, 44) }); })
              .concat(value.length > 3 ? [el("span", { class:"empty-value", text:"+" + (value.length - 3) })] : [])
          )]));
        } else cells.push(el("td", null, [el("div", { class:"cell-text", text:fmtValue(value) })]));
      });
      var lone = ((partner.evidence || {}).contradictions || []).length;
      cells.push(el("td", null, [
        el("div", { class:"cell-sub", text:(partner.quotes || []).length + " quote(s)" }),
        el("div", { class:"cell-sub", text:partner.source && partner.source.uri ? "source linked" : "no source uri" }),
        evidenceChips(partner.evidence, 3),
        lone ? el("div", { class:"cell-sub", style:"color:var(--warn)", text:lone + " claim(s) stand alone" }) : null
      ]));
      body.appendChild(el("tr", {
        class:"row", "data-id": partner.id, "aria-selected": STATE.selected === partner.id,
        onclick: function () { openDrawer(partner.id); }
      }, cells));
    });

    host.appendChild(el("div", { class:"table-wrap" }, [el("table", null, [el("thead", null, [head]), body])]));
  }

  /* ---------------- pipeline (kanban) ---------------- */
  function renderPipeline() {
    var p = STATE.payload, main = document.getElementById("main");
    var rows = visiblePartners();
    var order = ["tier_1", "tier_2", "tier_3", "unfit"];
    var tiersByKey = {};
    (p.tiers || []).forEach(function (t) { tiersByKey[t.tier] = t.min_score; });

    var board = el("div", { class:"kanban" });
    order.forEach(function (tier) {
      var cards = rows.filter(function (x) { return x.tier === tier; })
        .sort(function (a, b) { return (b.score === null ? -1 : b.score) - (a.score === null ? -1 : a.score); });
      var range = tier === "tier_1" ? (tiersByKey.tier_1 || 85) + "–100"
        : tier === "tier_2" ? (tiersByKey.tier_2 || 70) + "–" + ((tiersByKey.tier_1 || 85) - 1)
        : tier === "tier_3" ? (tiersByKey.tier_3 || 50) + "–" + ((tiersByKey.tier_2 || 70) - 1)
        : "below " + (tiersByKey.tier_3 || 50);
      var column = el("div", { class:"kanban-col", "data-tier": tier }, [
        el("div", { class:"kanban-head" }, [
          el("span", { class:"swatch", style:"background:" + TIER_COLOR[tier] }),
          el("span", { style:"font-weight:650", text:TIER_LABEL[tier] }),
          el("span", { class:"section-sub", text:range }),
          el("span", { class:"spacer" }),
          el("span", { class:"lane-count", text:cards.length })
        ])
      ]);
      if (!cards.length) {
        column.appendChild(el("div", { class:"kanban-empty", text:"No " + recordNoun().many.toLowerCase() + " in this stage for the current filters." }));
      } else {
        cards.forEach(function (partner) {
          var detailText = partner.detail || partner.practice;
          var ev = partner.evidence || {};
          var effectiveTier = ev.tier_capped && ev.tier_supported ? ev.tier_supported : partner.tier;
          var scorePill = el("span", {
            class: "score-pill " + (effectiveTier || "none"),
            text: partner.score === null ? "—" : partner.score,
            title: partner.score === null ? "unscored" : partner.score + " / " + p.checklist_total + " points"
          });
          var actionUrl = partner.action_url
            || (partner.answers || {}).requisition_url
            || (partner.source || {}).uri;
          if (!actionUrl && partner.id && partner.id.indexOf(".") !== -1 && partner.id.indexOf("/") === -1) {
            actionUrl = "https://" + partner.id;
          }
          var actionLabel = (partner.answers || {}).requisition_url
            ? "Apply ↗"
            : (presentation().action_label || "Site ↗");

          var cardTags = [];
          cardTags.push(el("span", { class:"tag soft mini", text:(partner.quotes || []).length + " quotes" }));
          (partner.highlights || []).slice(0, 3).forEach(function (h) {
            var tagClass = "tag soft mini";
            if (h.indexOf("comp:") === 0) tagClass = "tag tag-comp mini";
            else if (h.indexOf("territory:") === 0) tagClass = "tag tag-geo mini";
            else if (h.indexOf("stack:") === 0 || h.indexOf("alliances:") === 0) tagClass = "tag tag-tech mini";
            else if (h.indexOf("motion:") === 0) tagClass = "tag tag-motion mini";
            cardTags.push(el("span", { class:tagClass, text:h }));
          });

          var cardTopChildren = [
            el("button", { type:"button", class:"cell-name", text:partner.name || partner.id,
                           onclick: function (e) { e.stopPropagation(); openDrawer(partner.id); } }),
            el("span", { class:"spacer" }),
            ev.tier_capped ? el("span", { class:"tag mini", style:"border-color:var(--warn-line);color:var(--warn);font-weight:700", text:"capped", title:(ev.tier_reasons || []).join("; ") }) : null,
            scorePill
          ];

          var cardFooter = el("div", { style:"display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap" }, [
            el("div", { class:"card-tags", style:"margin-top:0;flex:1" }, cardTags),
            actionUrl ? el("a", {
              class: "card-action-btn",
              href: actionUrl,
              target: "_blank",
              rel: "noopener noreferrer",
              text: actionLabel,
              title: "Open " + actionLabel,
              onclick: function (e) { e.stopPropagation(); }
            }) : null
          ]);

          column.appendChild(el("div", {
            class:"card", "data-id": partner.id, "aria-selected": STATE.selected === partner.id,
            onclick: function () { openDrawer(partner.id); }
          }, [
            el("div", { class:"card-top" }, cardTopChildren),
            el("div", { class:"card-practice", text: detailText || ("no verified " + recordNoun().detail.toLowerCase() + " named") }),
            cardFooter
          ]));
        });
      }
      board.appendChild(column);
    });

    main.appendChild(el("section", { class:"section" }, [
      el("div", { class:"section-head" }, [
        el("h2", { class:"section-title", text:"Pipeline" }),
        el("span", { class:"section-sub", text:recordNoun().many.toLowerCase() + " grouped by the tier the scoring policy gave them · click a card for the dossier" })
      ]),
      board
    ]));

    var unscored = rows.filter(function (x) { return x.tier === null || x.tier === undefined; });
    if (unscored.length) {
      main.appendChild(el("div", { class:"panel" }, [
        el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Unscored" })]),
        el("div", { class:"list" }, unscored.map(function (partner) {
          return el("div", { class:"list-row" }, [
            el("div", { class:"list-label" }, [el("div", { class:"t", text:partner.name || partner.id })]),
            el("div", { class:"list-metric", text:"—" })
          ]);
        }))
      ]));
    }
  }

  function topAttribute(partner, p) {
    // The first attribute with a value, so a card says something specific.
    var attrs = p.attributes || [];
    for (var i = 0; i < attrs.length; i++) {
      var value = (partner.answers || {})[attrs[i].key];
      if (isEmptyValue(value)) continue;
      var text = fmtValue(value);
      return attrs[i].label + ": " + (text.length > 34 ? text.slice(0, 33) + "…" : text);
    }
    return "no attributes filled";
  }

  /* ---------------- scorecard ---------------- */
  function renderScorecard() {
    var p = STATE.payload, main = document.getElementById("main");
    var records = p.stats.records || 0;

    var coverage = el("div", { class:"panel" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Checklist coverage" }),
        el("span", { class:"spacer" }), el("span", { class:"section-sub", text:recordNoun().many.toLowerCase() + " passing" })]),
      el("div", { class:"list" }, (p.checklist || []).map(function (c) {
        return el("div", { class:"list-row" }, [
          el("div", { class:"list-label" }, [
            el("div", { class:"t", text:c.label }),
            el("div", { class:"d", text:c.description || "" })
          ]),
          el("div", { class:"list-bar" }, [el("span", { class:"bar " + (c.passed >= records * 0.6 ? "ok" : (c.passed ? "warn" : "bad")), style:"display:block" }, [
            el("span", { style:"width:" + pct(c.passed, records) + "%" })
          ])]),
          el("div", { class:"list-metric", text:c.passed + "/" + records }),
          el("div", { class:"list-metric", style:"color:var(--muted)", text:c.points + " pts" })
        ]);
      }))
    ]);

    var tierOrder = ["tier_1", "tier_2", "tier_3", "unfit"];
    var total = (p.partners || []).length || 1;
    var tiersByKey = {};
    (p.tiers || []).forEach(function (t) { tiersByKey[t.tier] = t.min_score; });
    var stack = el("div", { class:"stack" }, tierOrder.map(function (t) {
      var n = p.stats.tier_counts[t] || 0;
      return el("div", { style:"width:" + pct(n, total) + "%;background:" + TIER_COLOR[t], title:TIER_LABEL[t] + ": " + n });
    }));
    var legend = el("div", { class:"legend" }, tierOrder.map(function (t) {
      var n = p.stats.tier_counts[t] || 0;
      var range = t === "tier_1" ? (tiersByKey.tier_1 || 85) + "–100"
        : t === "tier_2" ? (tiersByKey.tier_2 || 70) + "–" + ((tiersByKey.tier_1 || 85) - 1)
        : t === "tier_3" ? (tiersByKey.tier_3 || 50) + "–" + ((tiersByKey.tier_2 || 70) - 1)
        : "below " + (tiersByKey.tier_3 || 50);
      return el("div", { class:"legend-row" }, [
        el("span", { class:"swatch", style:"background:" + TIER_COLOR[t] }),
        el("span", { text:TIER_LABEL[t] }),
        el("span", { class:"r", text:range }),
        el("span", { class:"n", text:n + " · " + pct(n, total) + "%" })
      ]);
    }));

    var scored = (p.partners || []).filter(function (x) { return x.score !== null; });
    var avgEarned = scored.length ? Math.round(scored.reduce(function (a, b) { return a + b.earned_points; }, 0) / scored.length) : 0;

    var tiersPanel = el("div", { class:"panel" }, [
      el("div", { class:"panel-head" }, [el("span", { class:"panel-title", text:"Score distribution" })]),
      el("div", { class:"panel-body" }, [
        stack, legend,
        el("div", { class:"section-sub", style:"margin-top:12px", text:"Average " + avgEarned + " of " + p.checklist_total + " points across " + scored.length + " scored " + recordNoun().many.toLowerCase() + ". Bands come from the scoring policy, not this page." })
      ])
    ]);

  }

  /* Every firm the fleet has looked at, across every run: the ladder's verdict,
     the score the last scoring node gave it, and what is still open. The run
     detail above answers "what happened"; this answers "who do we know". */
  function renderRunningList() {
    var main = document.getElementById("main"), ledger = STATE.payload.ledger || {};
    var rows = ledger.entities || [], counts = ledger.counts || {};
    var movers = ledger.movers || [];
    var section = el("section", { class:"section" }, [
      el("div", { class:"section-head" }, [
        el("h2", { class:"section-title", text:"Running list" }),
        el("span", { class:"section-sub", text:(counts.entities || 0) + " firm(s) remembered across runs · newest score first" })
      ])
    ]);
    if (movers.length) {
      section.appendChild(el("div", { class:"toolbar" }, [
        el("span", { class:"section-sub", text:"Moved: " + movers.map(function (m) {
          return m.entity + " " + (m.delta > 0 ? "+" : "") + m.delta.toFixed(1);
        }).join(" · ") })
      ]));
    }
    if (!rows.length) {
      section.appendChild(el("div", { class:"state", text:"Nothing on the list yet — no node has recorded an entity." }));
      main.appendChild(section);
      return;
    }
    var head = el("tr", null, [
      el("th", { text:"Firm" }), el("th", { text:"Outcome" }), el("th", { text:"Score" }),
      el("th", { text:"Tier" }), el("th", { text:"Last seen" }), el("th", { text:"Still open" }),
      el("th", { text:"Visits" })
    ]);
    var body = el("tbody");
    rows.forEach(function (row) {
      var open = (row.gates_open || []).join(", ") || "—";
      body.appendChild(el("tr", null, [
        el("td", { text: row.entity }),
        el("td", { text: row.standing || row.outcome || "unjudged" }),
        el("td", { class:"score-num", text: row.score ? Number(row.score).toFixed(1) : "—" }),
        el("td", { text: row.tier || "—" }),
        el("td", { text: String(row.last_seen || "").slice(0, 10) }),
        el("td", { text: open }),
        el("td", { text: String(row.sightings || 0) })
      ]));
    });
    section.appendChild(el("div", { class:"table-wrap" }, [
      el("table", null, [el("thead", null, [head]), body])
    ]));
    main.appendChild(section);
  }

  function renderRunPicker() {
    var sel = document.getElementById("runSelect");
    clear(sel);
    STATE.runs.forEach(function (r) {
      sel.appendChild(el("option", { value:r.run_id, selected:r.run_id === STATE.payload.run.run_id },
        [r.run_id + " · " + r.status + " · " + r.total_items + " item" + (r.total_items === 1 ? "" : "s")]));
    });
    sel.onchange = function () { loadRun(sel.value); };
  }

  function setStatus(status) {
    var pill = document.getElementById("statusPill");
    pill.className = "pill " + (status === "completed" ? "ok" : (status === "running" ? "warn" : "bad"));
    document.getElementById("statusText").textContent = status || "unknown";
  }

  function loadRun(runId) {
    var url = "/api/board" + (runId ? "?run=" + encodeURIComponent(runId) : "");
    fetch(url).then(function (r) {
      return r.json().then(function (body) { return { ok:r.ok, body:body }; });
    }).then(function (res) {
      var main = document.getElementById("main");
      if (!res.ok) {
        clear(main);
        main.appendChild(el("div", { class:"state" }, [
          el("strong", { text:"This run could not be loaded" }),
          el("span", { text:(res.body && res.body.error) ? res.body.error : "unknown error" })
        ]));
        return;
      }
      STATE.payload = res.body;
      STATE.selected = null;
      var p = STATE.payload;
      document.body.setAttribute("data-lane", (p.run.lane || "").toLowerCase());
      applyPresentation();
      var boardTitle = (p.run.lane ? titleCase(p.run.lane) + " Lane" : (p.run.task ? titleCase(p.run.task) : "Results")) + " Board";
      document.title = boardTitle + " · " + p.run.run_id;
      var brandTitle = document.getElementById("brandTitle");
      if (brandTitle) brandTitle.textContent = boardTitle;
      var entityCountNoun = p.stats.records === 1 ? recordNoun().one.toLowerCase() : recordNoun().many.toLowerCase();
      document.getElementById("runSub").textContent = (p.run.lane ? p.run.lane + " · " : "") + (p.run.task || "run") + " · " + p.stats.records + " " + entityCountNoun + " · " + shortTime(p.run.created_at);
      setStatus(p.run.status);
      if (history.replaceState) history.replaceState(null, "", "?run=" + encodeURIComponent(p.run.run_id));
      renderRunPicker();
      render();
    }).catch(function (err) {
      var main = document.getElementById("main");
      clear(main);
      main.appendChild(el("div", { class:"state" }, [el("strong", { text:"Board API unreachable" }), el("span", { text:String(err) })]));
    });
  }

  /* Esc, focus containment and focus restoration come from the modal dialog itself.
     A click on the backdrop targets the dialog element, and `closedby` makes that
     dismiss native where it is supported; the handler covers browsers without it. */
  var drawerEl = document.getElementById("drawer");
  drawerEl.addEventListener("click", function (e) { if (e.target === drawerEl) closeDrawer(); });
  drawerEl.addEventListener("close", function () { STATE.selected = null; markSelection(null); });

  if (window.__INITIAL_BOARD_DATA__) {
    STATE.payload = window.__INITIAL_BOARD_DATA__;
    STATE.runs = [{ run_id: STATE.payload.run.run_id, status: STATE.payload.run.status, total_items: (STATE.payload.stats || {}).records || 0 }];
    var p = STATE.payload;
    document.body.setAttribute("data-lane", (p.run.lane || "").toLowerCase());
    applyPresentation();
    var boardTitle = (p.run.lane ? titleCase(p.run.lane) + " Lane" : (p.run.task ? titleCase(p.run.task) : "Results")) + " Board";
    document.title = boardTitle + " · " + p.run.run_id;
    var brandTitle = document.getElementById("brandTitle");
    if (brandTitle) brandTitle.textContent = boardTitle;
    var entityCountNoun = (p.stats || {}).records === 1 ? recordNoun().one.toLowerCase() : recordNoun().many.toLowerCase();
    document.getElementById("runSub").textContent = (p.run.lane ? p.run.lane + " · " : "") + (p.run.task || "run") + " · " + ((p.stats || {}).records || 0) + " " + entityCountNoun + " · " + shortTime(p.run.created_at);
    setStatus(p.run.status);
    renderRunPicker();
    render();
  } else {
    var initial = new URLSearchParams(location.search).get("run");
    fetch("/api/runs").then(function (r) { return r.json(); }).then(function (body) {
      STATE.runs = body.runs || [];
      if (!initial && body.current) initial = body.current;
      loadRun(initial);
    }).catch(function () { loadRun(initial); });
  }
})();
</script>
</body>
</html>
